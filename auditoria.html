<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Log de Auditoria</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; border-bottom: 1px solid var(--paper-200); padding: var(--space-4) var(--space-6); }
  .topbar h1 { font-size: var(--text-xl); letter-spacing: 0.03em; }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); max-width: 1100px; }
  .card { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-5); }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; }
  .filtros select, .filtros input { border: 1px solid var(--paper-200); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--graphite-600); padding: 8px 10px; border-bottom: 2px solid var(--paper-200); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--paper-100); font-size: 13px; vertical-align: top; }
  .acao-tag { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; background: var(--paper-100); color: var(--graphite-700); }
  .acao-tag.criar { background: #EAF6EC; color: #1a7a3a; }
  .acao-tag.editar { background: #FFF8E8; color: #b45309; }
  .acao-tag.excluir, .acao-tag.remover, .acao-tag.inativar { background: #FDE8E8; color: #b91c1c; }
  .detalhes-txt { font-size: 11.5px; color: var(--graphite-600); font-family: var(--font-data); }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .content { padding: var(--space-4) !important; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar__logo">
      <img src="../assets/img/logo-dark.png" alt="SafeSeg" style="background:var(--graphite-900); border-radius:8px; padding:4px; max-width:150px; display:block;">
    </div>
    <a class="nav-item" href="../index.html" style="background:var(--graphite-900); color:var(--gold-300); margin-bottom:4px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Central (Hub)
    </a>
    <a class="nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>
    <div class="nav-section-label">Gestão Interna</div>
    <a class="nav-item" href="empresas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/><path d="M19 21V10a1 1 0 0 0-1-1h-3"/><path d="M8 7h2M8 11h2M8 15h2"/></svg>
      Empresas
    </a>
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Log de Auditoria
    </a>
    <button class="nav-item" style="width:100%; text-align:left; border:none; background:transparent; cursor:pointer; margin-top:auto; color:var(--status-danger);" onclick="fazerLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Sair
    </button>
  </nav>

  <div class="main">
    <div class="hazard-stripe"></div>
    <header class="topbar">
      <h1>Log de Auditoria</h1>
      <div class="sub" style="font-size:13px; color:var(--graphite-600);">Quem fez o quê e quando — registro automático das ações mais sensíveis</div>
    </header>

    <div class="content">
      <div id="connStatus" class="text-muted" style="font-size:12px;">Conectando...</div>

      <div class="card">
        <div class="filtros">
          <select id="fAcao" onchange="renderLog()">
            <option value="">Todas as ações</option>
          </select>
          <input type="text" id="fUsuario" placeholder="Filtrar por pessoa..." oninput="renderLog()">
          <input type="date" id="fDataDe" onchange="renderLog()">
          <input type="date" id="fDataAte" onchange="renderLog()">
        </div>
      </div>

      <div class="card">
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Data/Hora</th><th>Quem</th><th>Ação</th><th>Detalhes</th></tr></thead>
          <tbody id="logBody"></tbody>
        </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { db, collection, getDocs, esperarAuth } from '../assets/js/firebase-init.js';

  let logCache = [];

  const LABELS_ACAO = {
    editar_certificado: 'Editou certificado',
    regenerar_certificado: 'Regenerou certificado',
    criar_funcionario: 'Criou funcionário',
    editar_funcionario: 'Editou funcionário',
    inativar_funcionario: 'Inativou funcionário',
    reativar_funcionario: 'Reativou funcionário',
    excluir_funcionario: 'Excluiu funcionário',
    mover_funcionario: 'Moveu funcionário de empresa',
    criar_acesso_cliente: 'Criou acesso de cliente',
    remover_acesso_cliente: 'Removeu acesso de cliente'
  };
  function corAcao(acao) {
    if (acao.startsWith('criar')) return 'criar';
    if (acao.startsWith('editar') || acao.startsWith('regenerar') || acao.startsWith('mover') || acao.startsWith('reativar')) return 'editar';
    return 'excluir';
  }
  function fmtData(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }

  async function carregarLog() {
    const status = document.getElementById('connStatus');
    await esperarAuth();
    try {
      const snap = await getDocs(collection(db, 'auditoria'));
      logCache = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.criadoEm||'').localeCompare(a.criadoEm||''));

      const acoesUnicas = [...new Set(logCache.map(l => l.acao))];
      const selectAcao = document.getElementById('fAcao');
      selectAcao.innerHTML = '<option value="">Todas as ações</option>' + acoesUnicas.map(a => `<option value="${a}">${LABELS_ACAO[a] || a}</option>`).join('');

      renderLog();
      status.textContent = `✅ ${logCache.length} registro(s) carregado(s).`;
      status.style.color = 'var(--status-ok)';
    } catch (err) {
      status.textContent = `⚠️ Erro: ${err.message}`;
      status.style.color = 'var(--status-danger)';
    }
  }

  window.renderLog = function() {
    const fAcao = document.getElementById('fAcao').value;
    const fUsuario = document.getElementById('fUsuario').value.toLowerCase().trim();
    const fDe = document.getElementById('fDataDe').value;
    const fAte = document.getElementById('fDataAte').value;

    const filtrado = logCache.filter(l => {
      if (fAcao && l.acao !== fAcao) return false;
      if (fUsuario && !(l.usuarioNome||'').toLowerCase().includes(fUsuario) && !(l.usuarioEmail||'').toLowerCase().includes(fUsuario)) return false;
      if (fDe && l.criadoEm < fDe) return false;
      if (fAte && l.criadoEm > fAte + 'T23:59:59') return false;
      return true;
    });

    const box = document.getElementById('logBody');
    if (filtrado.length === 0) {
      box.innerHTML = '<tr><td colspan="4" class="text-muted" style="text-align:center; padding:20px;">Nenhum registro encontrado.</td></tr>';
      return;
    }
    box.innerHTML = filtrado.map(l => `
      <tr>
        <td style="white-space:nowrap;">${fmtData(l.criadoEm)}</td>
        <td>${l.usuarioNome || l.usuarioEmail || '—'}</td>
        <td><span class="acao-tag ${corAcao(l.acao)}">${LABELS_ACAO[l.acao] || l.acao}</span></td>
        <td class="detalhes-txt">${Object.entries(l.detalhes || {}).map(([k,v]) => `${k}: ${v}`).join(' · ')}</td>
      </tr>`).join('');
  };

  carregarLog();
</script>
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>

</body>
</html>
