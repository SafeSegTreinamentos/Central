<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Empresas</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: #fff; border-bottom: 1px solid var(--paper-200);
    padding: var(--space-4) var(--space-6);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3);
  }
  .topbar h1 { font-size: var(--text-xl); letter-spacing: 0.03em; }
  .topbar .sub { font-size: var(--text-sm); color: var(--graphite-600); margin-top: 2px; }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--paper-200); border-radius: var(--radius-sm);
    padding: 8px 12px; background: #fff; min-width: 240px; flex: 1; max-width: 340px;
  }
  .search-box input { border: none; outline: none; flex: 1; font-family: var(--font-body); font-size: var(--text-sm); }
  .search-box svg { width: 16px; height: 16px; color: var(--graphite-600); flex-shrink: 0; }

  /* Grid de empresas */
  .empresa-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: var(--space-4);
  }
  .empresa-card {
    background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md);
    box-shadow: var(--shadow-card); padding: var(--space-5);
    display: flex; flex-direction: column; gap: var(--space-3);
    transition: box-shadow 0.18s ease, transform 0.18s ease;
  }
  .empresa-card:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); }

  .empresa-card__head { display: flex; align-items: center; gap: var(--space-3); }
  .empresa-avatar {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(135deg, var(--gold-300), var(--gold-600));
    color: var(--graphite-900);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 16px; flex-shrink: 0;
  }
  .empresa-nome { font-weight: 700; font-size: var(--text-base); line-height: 1.2; }
  .empresa-cnpj { font-family: var(--font-data); font-size: 11px; color: var(--graphite-600); }
  .empresa-setor { font-size: var(--text-xs); color: var(--graphite-600); text-transform: uppercase; letter-spacing: 0.03em; }

  .empresa-stats {
    display: flex; gap: var(--space-4);
    padding-top: var(--space-3); border-top: 1px solid var(--paper-100);
  }
  .empresa-stat { flex: 1; }
  .empresa-stat__value { font-family: var(--font-display); font-size: 1.4rem; line-height: 1; }
  .empresa-stat__label { font-size: 10px; color: var(--graphite-600); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }

  .empresa-card__footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .access-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: var(--graphite-600);
  }
  .access-tag svg { width: 13px; height: 13px; }
  .access-tag.granted { color: var(--status-ok); }
  .access-tag.none { color: var(--status-pending); }

  /* Modal simples de nova empresa (visual only) */
  .new-empresa-card {
    border: 2px dashed var(--paper-200); border-radius: var(--radius-md);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: var(--space-5); color: var(--graphite-600);
    min-height: 180px; cursor: pointer;
  }
  .new-empresa-card:hover { border-color: var(--gold-400); color: var(--gold-600); }
  .new-empresa-card svg { width: 28px; height: 28px; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .content { padding: var(--space-4) !important; }
    .topbar { padding: var(--space-3) var(--space-4) !important; }
    .empresa-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar__logo">
      <img src="../assets/img/logo-dark.png" alt="SafeSeg" style="background:var(--graphite-900); border-radius:8px; padding:4px; max-width:150px; display:block;">
    </div>
    
    <a class="nav-item" href="../index.html" style="background:var(--graphite-900); color:var(--gold-300); margin-bottom:4px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Central (Hub)
    </a>
    <a class="nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>
    <div class="nav-section-label">Gestão Interna</div>
    <a class="nav-item active" href="empresas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/><path d="M19 21V10a1 1 0 0 0-1-1h-3"/><path d="M8 7h2M8 11h2M8 15h2"/></svg>
      Empresas
    </a>
    <a class="nav-item" href="gerador-turmas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M9 18v3M15 18v3"/></svg>
      Gerador de Turmas
    </a>
    <a class="nav-item" href="tecnica.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 2a2.5 2.5 0 0 0-2.5 2.5V6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2V4.5A2.5 2.5 0 0 0 14.5 2z"/><path d="M9 12h6M9 16h4"/></svg>
      Central Técnica
    </a>
    <div class="nav-section-label">Documentos &amp; Certificação</div>
    <a class="nav-item" href="certificados.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16c0-5 4-9 9-9s9 4 9 9"/><path d="M2 16h20"/><path d="M9 7V4"/></svg>
      Certificados
    </a>
    <a class="nav-item" href="documentos.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>
      Documentos
    </a>
    <a class="nav-item" href="agenda-turmas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="7" rx="2"/><path d="M9 10v4M15 10v4M6 14h12v7H6z"/></svg>
      Agenda de Turmas
    </a>
    <a class="nav-item" href="../validador/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      Validador Público
    </a>
  </nav>

  <div class="main">
    <div class="hazard-stripe"></div>
    <header class="topbar">
      <div>
        <h1>Empresas</h1>
        <div class="sub">14 empresas cadastradas · 11 com acesso ao portal ativo</div>
      </div>
      <div class="flex gap-2">
        <button class="btn btn--secondary">↓ Exportar</button>
        <button class="btn btn--primary">+ Nova Empresa</button>
      </div>
    </header>

    <div class="content">

      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="text" placeholder="Buscar empresa ou CNPJ...">
        </div>
      </div>

      <div id="connStatus" class="text-muted" style="font-size:12px; margin-bottom:-8px;">Conectando...</div>

      <div class="empresa-grid" id="empresaGrid">
        <div class="new-empresa-card" onclick="abrirModalNovaEmpresa()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          <span style="font-size:var(--text-sm); font-weight:600;">Cadastrar nova empresa</span>
        </div>
      </div>

      <!-- MODAL NOVA EMPRESA -->
      <div id="modalOverlay" style="display:none; position:fixed; inset:0; background:rgba(20,23,27,0.55); align-items:center; justify-content:center; z-index:50; padding:16px;">
        <div style="background:#fff; border-radius:16px; width:100%; max-width:440px; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
          <div style="padding:20px; border-bottom:1px solid var(--paper-200); display:flex; align-items:center; justify-content:space-between;">
            <h3 style="font-family:var(--font-display); font-size:1.2rem; margin:0;">Nova Empresa</h3>
            <button onclick="fecharModalNovaEmpresa()" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--graphite-600);">✕</button>
          </div>
          <div style="padding:20px; display:flex; flex-direction:column; gap:12px;">
            <div>
              <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Nome / Razão Social</label>
              <input type="text" id="novaEmpresaNome" placeholder="Ex: Metalúrgica Trentin Ltda" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
            </div>
            <div>
              <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">CNPJ</label>
              <input type="text" id="novaEmpresaCnpj" placeholder="00.000.000/0000-00" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
            </div>
            <div style="display:flex; gap:10px;">
              <div style="flex:1;">
                <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Segmento</label>
                <input type="text" id="novaEmpresaSeg" placeholder="Ex: Metalurgia" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
              </div>
              <div style="flex:1;">
                <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Cidade</label>
                <input type="text" id="novaEmpresaCidade" placeholder="Ex: Dois Vizinhos" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
              </div>
            </div>
            <div>
              <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Responsável</label>
              <input type="text" id="novaEmpresaResp" placeholder="Nome do contato" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
            </div>
            <div id="novaEmpresaErro" style="color:var(--status-danger); font-size:13px; display:none;"></div>
          </div>
          <div style="padding:16px 20px; border-top:1px solid var(--paper-200); display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn btn--secondary" onclick="fecharModalNovaEmpresa()">Cancelar</button>
            <button class="btn btn--primary" id="btnSalvarEmpresa" onclick="salvarNovaEmpresa()">Salvar empresa</button>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<script type="module">
  import { db, collection, getDocs, addDoc, esperarAuth } from '../assets/js/firebase-init.js';

  // Schema confirmado da coleção 'empresas': nome, cnpj, seg, cidade, resp.
  // Certificados vivem como SUBCOLEÇÃO: empresas/{id}/certificados
  function iniciais(nome) {
    return (nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
  }

  async function carregarEmpresas() {
    const status = document.getElementById('connStatus');
    const grid = document.getElementById('empresaGrid');

    // 1) Espera o Firebase confirmar a sessão antes de tentar ler qualquer coisa
    const user = await esperarAuth();
    if (!user) {
      status.textContent = '🔒 Você precisa estar logado pra ver as empresas.';
      status.style.color = 'var(--status-warn)';
      return;
    }

    // 2) Só agora tenta ler o Firestore, com a sessão já confirmada
    try {
      const snap = await getDocs(collection(db, 'empresas'));
      if (snap.empty) {
        status.textContent = 'Nenhuma empresa cadastrada ainda. Clique em "Cadastrar nova empresa".';
        return;
      }

      const empresasComContagem = await Promise.all(snap.docs.map(async docSnap => {
        const d = docSnap.data();
        let totalCertificados = 0;
        try {
          const certSnap = await getDocs(collection(db, 'empresas', docSnap.id, 'certificados'));
          totalCertificados = certSnap.size;
        } catch (e) { /* sem permissão ou subcoleção vazia */ }
        return { id: docSnap.id, ...d, totalCertificados };
      }));

      const cardsHtml = empresasComContagem.map(emp => `
        <div class="empresa-card">
          <div class="empresa-card__head">
            <div class="empresa-avatar">${iniciais(emp.nome)}</div>
            <div>
              <div class="empresa-nome">${emp.nome || '(sem nome)'}</div>
              <div class="empresa-cnpj">${emp.cnpj || '—'}</div>
            </div>
          </div>
          ${emp.seg ? `<div class="empresa-setor">${emp.seg}</div>` : ''}
          <div class="empresa-stats">
            <div class="empresa-stat"><div class="empresa-stat__value">${emp.totalCertificados}</div><div class="empresa-stat__label">Certificados</div></div>
          </div>
          ${(emp.cidade || emp.resp) ? `<div style="font-size:12px; color:var(--graphite-600); display:flex; justify-content:space-between;">
            ${emp.cidade ? `<span>📍 ${emp.cidade}</span>` : '<span></span>'}
            ${emp.resp ? `<span>👤 ${emp.resp}</span>` : ''}
          </div>` : ''}
          <div class="empresa-card__footer">
            <button class="btn btn--ghost" style="padding:6px 10px; font-size:12px; margin-left:auto;" data-id="${emp.id}">Gerenciar</button>
          </div>
        </div>
      `);

      grid.querySelector('.new-empresa-card').insertAdjacentHTML('beforebegin', cardsHtml.join(''));
      status.textContent = `${snap.size} empresa(s) carregada(s).`;
      status.style.color = 'var(--status-ok)';
    } catch (err) {
      console.error('Erro ao carregar empresas do Firestore:', err);
      status.textContent = `⚠️ Erro ao carregar: ${err.message}`;
      status.style.color = 'var(--status-danger)';
    }
  }

  carregarEmpresas();

  // ---------- Modal Nova Empresa ----------
  window.abrirModalNovaEmpresa = function() {
    document.getElementById('modalOverlay').style.display = 'flex';
  };
  window.fecharModalNovaEmpresa = function() {
    document.getElementById('modalOverlay').style.display = 'none';
    document.getElementById('novaEmpresaErro').style.display = 'none';
  };
  window.salvarNovaEmpresa = async function() {
    const nome = document.getElementById('novaEmpresaNome').value.trim();
    const cnpj = document.getElementById('novaEmpresaCnpj').value.trim();
    const seg = document.getElementById('novaEmpresaSeg').value.trim();
    const cidade = document.getElementById('novaEmpresaCidade').value.trim();
    const resp = document.getElementById('novaEmpresaResp').value.trim();
    const erroBox = document.getElementById('novaEmpresaErro');
    const btn = document.getElementById('btnSalvarEmpresa');

    if (!nome) {
      erroBox.textContent = 'Digite o nome da empresa.';
      erroBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Salvando...';
    erroBox.style.display = 'none';

    try {
      await addDoc(collection(db, 'empresas'), { nome, cnpj, seg, cidade, resp });
      window.fecharModalNovaEmpresa();
      // recarrega a lista já com a empresa nova
      document.getElementById('empresaGrid').querySelectorAll('.empresa-card').forEach(el => el.remove());
      carregarEmpresas();
    } catch (err) {
      console.error('Erro ao salvar empresa:', err);
      erroBox.textContent = `Erro ao salvar: ${err.message}`;
      erroBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Salvar empresa';
    }
  };
</script>

</body>
</html>
