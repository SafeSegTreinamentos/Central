<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Financeiro</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; border-bottom: 1px solid var(--paper-200); padding: var(--space-4) var(--space-6); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); }
  .topbar h1 { font-size: var(--text-xl); letter-spacing: 0.03em; }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); max-width: 1100px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .kpi { background: #fff; border: 1px solid var(--paper-200); border-radius: 10px; padding: 16px; box-shadow: var(--shadow-card); }
  .kpi .lbl { font-size: 11px; text-transform: uppercase; color: var(--graphite-600); letter-spacing:.03em; }
  .kpi .val { font-family: var(--font-display); font-size: 1.8rem; margin-top: 4px; }
  .tabs { display: flex; gap: 4px; background: var(--paper-100); padding: 4px; border-radius: 8px; width: fit-content; }
  .tab { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--graphite-600); }
  .tab.active { background: #fff; color: var(--graphite-900); box-shadow: var(--shadow-card); }
  .card { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-5); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--graphite-600); padding: 8px 10px; border-bottom: 2px solid var(--paper-200); letter-spacing: .03em; }
  td { padding: 10px; border-bottom: 1px solid var(--paper-100); font-size: 13.5px; vertical-align: middle; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .content { padding: var(--space-4) !important; }
    .topbar { padding: var(--space-3) var(--space-4) !important; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar__logo">
      <img src="../assets/img/logo-dark.png" alt="SafeSeg" style="background:var(--graphite-900); border-radius:8px; padding:4px; max-width:150px; display:block;">
    </div>
    <a class="nav-item" href="../index.html" style="background:var(--graphite-900); color:var(--gold-300); margin-bottom:4px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Central (Hub)
    </a>
    <a class="nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>
    <div class="nav-section-label">Comercial (CRM)</div>
    <a class="nav-item" href="leads.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      Leads (Funil)
    </a>
    <a class="nav-item" href="propostas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h3"/></svg>
      Propostas
    </a>
    <a class="nav-item" href="catalogo-cursos.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Catálogo de Cursos
    </a>

    <a class="nav-item" href="mensagens.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Central de Mensagens
    </a>

    <a class="nav-item" href="empresas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/><path d="M19 21V10a1 1 0 0 0-1-1h-3"/><path d="M8 7h2M8 11h2M8 15h2"/></svg>
      Empresas (clientes)
    </a>
    <div class="nav-section-label">Financeiro</div>
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Financeiro
    </a>
    <button class="nav-item" style="width:100%; text-align:left; border:none; background:transparent; cursor:pointer; margin-top:auto; color:var(--status-danger);" onclick="fazerLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Sair
    </button>
  </nav>

  <div class="main">
    <div class="hazard-stripe"></div>
    <header class="topbar">
      <div>
        <h1>Financeiro</h1>
        <div class="sub" id="topbarSub" style="font-size:13px; color:var(--graphite-600);">Carregando...</div>
      </div>
      <button class="btn btn--primary" id="btnNovoLancamento" onclick="abrirModalLancamento()">+ Novo Lançamento</button>
    </header>

    <div class="content">
      <div id="connStatus" class="text-muted" style="font-size:12px;">Conectando...</div>

      <div class="kpi-row">
        <div class="kpi"><div class="lbl">A Receber (aberto)</div><div class="val" id="kpiReceber" style="color:var(--status-ok);">—</div></div>
        <div class="kpi"><div class="lbl">A Pagar (aberto)</div><div class="val" id="kpiPagar" style="color:var(--status-danger);">—</div></div>
        <div class="kpi"><div class="lbl">Saldo previsto</div><div class="val" id="kpiSaldo">—</div></div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tabReceber" onclick="mudarAba('receber')">A Receber</button>
        <button class="tab" id="tabPagar" onclick="mudarAba('pagar')">A Pagar</button>
      </div>

      <div class="card">
        <div id="lancamentosList">Carregando...</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL LANÇAMENTO -->
<div id="modalLancOverlay" style="display:none; position:fixed; inset:0; background:rgba(20,23,27,0.55); align-items:center; justify-content:center; z-index:60; padding:16px;">
  <div style="background:#fff; border-radius:16px; width:100%; max-width:440px; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
    <div style="padding:20px; border-bottom:1px solid var(--paper-200); display:flex; align-items:center; justify-content:space-between;">
      <h3 style="font-family:var(--font-display); font-size:1.2rem; margin:0;">Novo Lançamento</h3>
      <button onclick="fecharModalLancamento()" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--graphite-600);">✕</button>
    </div>
    <div style="padding:20px; display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Tipo</label>
        <select id="lancTipo" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;" onchange="alternarCampoEmpresa()">
          <option value="receber">A Receber (de um cliente)</option>
          <option value="pagar">A Pagar (despesa geral)</option>
        </select>
      </div>
      <div id="campoEmpresaBox">
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Empresa (cliente)</label>
        <select id="lancEmpresa" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;"></select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Descrição</label>
        <input type="text" id="lancDescricao" placeholder="Ex: Turma NR-35 Agosto" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
      </div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Valor</label>
          <input type="number" id="lancValor" placeholder="0,00" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
        </div>
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Vencimento</label>
          <input type="date" id="lancVencimento" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
        </div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Status</label>
        <select id="lancStatus" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
          <option value="aberto">Em aberto</option>
          <option value="pago">Pago/Recebido</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Link da Nota Fiscal (NFS-e) <span style="text-transform:none; font-weight:400; color:var(--graphite-400);">— opcional, cola o link depois de emitir no site da prefeitura</span></label>
        <input type="text" id="lancLinkNF" placeholder="https://..." style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
      </div>
      <div id="lancErro" style="color:var(--status-danger); font-size:13px; display:none;"></div>
    </div>
    <div style="padding:16px 20px; border-top:1px solid var(--paper-200); display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn--secondary" onclick="fecharModalLancamento()">Cancelar</button>
      <button class="btn btn--primary" onclick="salvarLancamento()">Salvar</button>
    </div>
  </div>
</div>

<script type="module">
  import { db, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, esperarAuth } from '../assets/js/firebase-init.js';

  let empresasCache = [];
  let receberCache = []; // { id, empresaId, empresaNome, descricao, valor, vencimento, status }
  let pagarCache = [];   // { id, descricao, valor, vencimento, status, categoria }
  let abaAtual = 'receber';

  function fmtMoeda(v) { return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2}); }

  async function carregarTudo() {
    const status = document.getElementById('connStatus');
    await esperarAuth();
    try {
      const empresasSnap = await getDocs(collection(db, 'empresas'));
      empresasCache = empresasSnap.docs.map(d => ({ id: d.id, nome: d.data().nome || '(sem nome)' }));

      const selectEmpresa = document.getElementById('lancEmpresa');
      selectEmpresa.innerHTML = empresasCache.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');

      // A Receber: subcoleção financeiro de cada empresa
      receberCache = [];
      await Promise.all(empresasCache.map(async emp => {
        const finSnap = await getDocs(collection(db, 'empresas', emp.id, 'financeiro'));
        finSnap.forEach(d => {
          receberCache.push({ id: d.id, empresaId: emp.id, empresaNome: emp.nome, ...d.data() });
        });
      }));

      // A Pagar: coleção de topo
      const pagarSnap = await getDocs(collection(db, 'contasPagar'));
      pagarCache = pagarSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      atualizarKPIs();
      render();
      status.textContent = '✅ Carregado.';
      status.style.color = 'var(--status-ok)';
    } catch (err) {
      console.error(err);
      status.textContent = `⚠️ Erro: ${err.message}`;
      status.style.color = 'var(--status-danger)';
    }
  }

  function atualizarKPIs() {
    const totalReceber = receberCache.filter(r => r.status !== 'pago').reduce((s,r) => s + Number(r.valor||0), 0);
    const totalPagar = pagarCache.filter(p => p.status !== 'pago').reduce((s,p) => s + Number(p.valor||0), 0);
    document.getElementById('kpiReceber').textContent = fmtMoeda(totalReceber);
    document.getElementById('kpiPagar').textContent = fmtMoeda(totalPagar);
    const saldo = totalReceber - totalPagar;
    const saldoEl = document.getElementById('kpiSaldo');
    saldoEl.textContent = fmtMoeda(saldo);
    saldoEl.style.color = saldo >= 0 ? 'var(--status-ok)' : 'var(--status-danger)';
    document.getElementById('topbarSub').textContent = `${receberCache.length} a receber · ${pagarCache.length} a pagar`;
  }

  window.mudarAba = function(aba) {
    abaAtual = aba;
    document.getElementById('tabReceber').classList.toggle('active', aba === 'receber');
    document.getElementById('tabPagar').classList.toggle('active', aba === 'pagar');
    render();
  };

  function render() {
    const box = document.getElementById('lancamentosList');
    const lista = abaAtual === 'receber' ? receberCache : pagarCache;
    if (lista.length === 0) {
      box.innerHTML = `<div class="text-muted" style="text-align:center; padding:20px;">Nenhum lançamento ${abaAtual === 'receber' ? 'a receber' : 'a pagar'} ainda.</div>`;
      return;
    }
    box.innerHTML = `
      <table>
        <thead><tr>${abaAtual==='receber' ? '<th>Empresa</th>' : ''}<th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${lista.map(l => `
            <tr>
              ${abaAtual==='receber' ? `<td>${l.empresaNome}</td>` : ''}
              <td>${l.descricao || '—'}</td>
              <td>${fmtMoeda(l.valor)}</td>
              <td style="font-family:var(--font-data); font-size:12px;">${l.vencimento ? l.vencimento.split('-').reverse().join('/') : '—'}</td>
              <td><span class="selo selo--${l.status==='pago'?'ok':'pending'}">${l.status==='pago'?'Pago':'Em aberto'}</span></td>
              <td>
                ${l.linkNF ? `<a href="${l.linkNF}" target="_blank" class="btn btn--ghost" style="padding:5px 9px; font-size:11px; text-decoration:none;" title="Nota Fiscal">📄 NF</a>` : ''}
                ${l.status !== 'pago' ? `<button class="btn btn--secondary" style="padding:5px 9px; font-size:11px;" onclick="marcarComoPago('${l.id}', '${l.empresaId||''}')">Marcar pago</button>` : ''}
                <button class="btn btn--danger" style="padding:5px 9px; font-size:11px;" onclick="excluirLancamento('${l.id}', '${l.empresaId||''}')">Excluir</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  window.alternarCampoEmpresa = function() {
    const tipo = document.getElementById('lancTipo').value;
    document.getElementById('campoEmpresaBox').style.display = tipo === 'receber' ? 'block' : 'none';
  };

  window.abrirModalLancamento = function() {
    document.getElementById('lancTipo').value = abaAtual;
    alternarCampoEmpresa();
    document.getElementById('lancDescricao').value = '';
    document.getElementById('lancValor').value = '';
    document.getElementById('lancVencimento').value = '';
    document.getElementById('lancStatus').value = 'aberto';
    document.getElementById('lancLinkNF').value = '';
    document.getElementById('lancErro').style.display = 'none';
    document.getElementById('modalLancOverlay').style.display = 'flex';
  };
  window.fecharModalLancamento = function() {
    document.getElementById('modalLancOverlay').style.display = 'none';
  };

  window.salvarLancamento = async function() {
    const tipo = document.getElementById('lancTipo').value;
    const descricao = document.getElementById('lancDescricao').value.trim();
    const valor = document.getElementById('lancValor').value;
    const vencimento = document.getElementById('lancVencimento').value;
    const statusCampo = document.getElementById('lancStatus').value;
    const linkNF = document.getElementById('lancLinkNF').value.trim();
    const erroBox = document.getElementById('lancErro');
    if (!descricao || !valor) { erroBox.textContent = 'Preenche descrição e valor.'; erroBox.style.display = 'block'; return; }

    try {
      if (tipo === 'receber') {
        const empresaId = document.getElementById('lancEmpresa').value;
        if (!empresaId) { erroBox.textContent = 'Escolhe a empresa.'; erroBox.style.display = 'block'; return; }
        await addDoc(collection(db, 'empresas', empresaId, 'financeiro'), { descricao, valor, vencimento, status: statusCampo, linkNF });
      } else {
        await addDoc(collection(db, 'contasPagar'), { descricao, valor, vencimento, status: statusCampo, linkNF });
      }
      fecharModalLancamento();
      carregarTudo();
    } catch (err) {
      erroBox.textContent = 'Erro: ' + err.message;
      erroBox.style.display = 'block';
    }
  };

  window.marcarComoPago = async function(id, empresaId) {
    try {
      if (empresaId) await updateDoc(doc(db, 'empresas', empresaId, 'financeiro', id), { status: 'pago' });
      else await updateDoc(doc(db, 'contasPagar', id), { status: 'pago' });
      carregarTudo();
    } catch (err) { alert('Erro: ' + err.message); }
  };
  window.excluirLancamento = async function(id, empresaId) {
    if (!confirm('Excluir esse lançamento?')) return;
    try {
      if (empresaId) await deleteDoc(doc(db, 'empresas', empresaId, 'financeiro', id));
      else await deleteDoc(doc(db, 'contasPagar', id));
      carregarTudo();
    } catch (err) { alert('Erro: ' + err.message); }
  };

  carregarTudo();
</script>
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>

</body>
</html>
