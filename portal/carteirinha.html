  function statusPorData(dataStr) {
    if (!dataStr) return { cls: 'pending', cor: [120,120,120] };
    const venc = new Date(dataStr.split('/').reverse().join('-'));
    const dias = (venc - new Date()) / 86400000;
    if (dias < 0) return { cls: 'danger', cor: [220,38,38] };
    if (dias <= 60) return { cls: 'warn', cor: [217,119,6] };
    return { cls: 'ok', cor: [22,163,74] };
  }
  function formatarDataBR(iso) {
    if (!iso) return '';
    if (iso.includes('/')) return iso; // já formatado
    const [a,m,d] = iso.split('-');
    return d && m && a ? `${d}/${m}/${a}` : '';
  }
  function sanitizarTexto(s) {
    return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^ -~]/g, '');
  }
  // Normaliza texto pra comparar nomes de pessoa/curso sem depender de
  // acento, maiúscula/minúscula ou espaço duplo — usada tanto no
  // carregamento quanto na geração do PDF, por isso fica aqui em cima
  function normaliza(s) {
    return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  }

  async function carregar() {
    const sub = document.getElementById('subInfo');
    if (!empresaId || !funcionarioId) {
      sub.textContent = '⚠️ Link incompleto — volta na tela do funcionário e clica em "🪪 Carteirinha" de novo.';
      return;
    }
    await esperarAuth();
    try {
      const [funcSnap, empSnap, certSnap, catSnap] = await Promise.all([
        getDoc(doc(db, 'empresas', empresaId, 'funcionarios', funcionarioId)),
        getDoc(doc(db, 'empresas', empresaId)),
        getDocs(collection(db, 'empresas', empresaId, 'certificados')),
        getDocs(collection(db, 'catalogoCursos'))
      ]);

      if (!funcSnap.exists()) { sub.textContent = '⚠️ Funcionário não encontrado.'; return; }
      dadosFuncionario = funcSnap.data();
      dadosEmpresa = empSnap.exists() ? empSnap.data() : { nome: '' };

      catSnap.forEach(d => { const c = d.data(); catalogoMap[normaliza(c.nome)] = c; });

      // 🔍 DIAGNÓSTICO TEMPORÁRIO — mostra no console (F12) os dados reais
      // pra achar por que o casamento de nome está falhando em certos casos
      console.log('🔍 Nome do funcionário (bruto):', JSON.stringify(dadosFuncionario.nome));
      console.log('🔍 Nome normalizado:', JSON.stringify(normaliza(dadosFuncionario.nome)));
      console.log('🔍 Todos os certificados dessa empresa:', certSnap.docs.map(d => {
        const c = d.data();
        return {
          colaborador_bruto: c.colaborador,
          colaborador_normalizado: normaliza(c.colaborador),
          bate_com_funcionario: normaliza(c.colaborador) === normaliza(dadosFuncionario.nome),
          tem_substituidoPor: !!c.substituidoPor,
          nr: c.nr,
          validade: c.validade
        };
      }));

      cursosAtivos = certSnap.docs
        .map(d => d.data())
        .filter(c => normaliza(c.colaborador) === normaliza(dadosFuncionario.nome))
        .filter(c => !c.substituidoPor)
        .sort((a,b) => {
          const da = a.validade ? new Date(a.validade.split('/').reverse().join('-')) : new Date(0);
          const db_ = b.validade ? new Date(b.validade.split('/').reverse().join('-')) : new Date(0);
          return da - db_;
        });

      document.getElementById('previewBox').innerHTML = `<div style="padding:16px; font-size:12px; color:var(--graphite-700);">
        <strong>${dadosFuncionario.nome}</strong><br>${dadosEmpresa.nome||''}<br><br>
        ${cursosAtivos.length} treinamento(s) — clica em "Baixar PDF" pra ver a carteirinha completa.
      </div>`;
      sub.textContent = `${dadosFuncionario.nome} · ${dadosEmpresa.nome || ''} · ${cursosAtivos.length} treinamento(s)`;
    } catch (err) {
      sub.textContent = '⚠️ Erro: ' + err.message;
      console.error(err);
    }
  }

  // Busca o QR code (validador público, com o CPF já preenchido) como imagem,
  // pra poder colar no PDF — mesmo serviço já usado no resto do sistema
  async function buscarQrCodeBase64(cpfLimpo) {
    try {
      const url = URL_VALIDADOR + '?cpf=' + cpfLimpo;
      const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(url);
      const res = await fetch(qrUrl);
      const blob = await res.blob();
      return await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    } catch (e) {
      console.error('Erro ao gerar QR code:', e);
      return null;
    }
  }

  window.gerarPDFCarteirinha = async function() {
    if (!dadosFuncionario) { alert('Aguarda carregar os dados primeiro.'); return; }
    const botao = event.target;
    const textoOriginal = botao.textContent;
    botao.disabled = true; botao.textContent = 'Gerando...';

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [85, 120] });
    const W = 85, H = 120;
    const PRETO = [17, 17, 17], AMBAR = [245, 158, 11], AMBAR_ESCURO = [180, 116, 9];
    const BRANCO = [255,255,255], CINZA_TXT = [70,70,70], CINZA_CLARO = [235,235,235];

    const cpfLimpo = (dadosFuncionario.cpf || '').replace(/\D/g, '');
    const numeroCarteira = 'ST-' + (cpfLimpo ? cpfLimpo.slice(0,8) : String(funcionarioId).slice(0,8).toUpperCase());
    const hoje = new Date();
    const dataEmissaoFmt = String(hoje.getDate()).padStart(2,'0') + '/' + String(hoje.getMonth()+1).padStart(2,'0') + '/' + hoje.getFullYear();

    /* ============================== FRENTE ============================== */
    doc.setFillColor(...BRANCO); doc.rect(0, 0, W, H, 'F');

    // cabeçalho preto
    doc.setFillColor(...PRETO); doc.rect(0, 0, W, 24, 'F');
    doc.setFillColor(...AMBAR); doc.rect(0, 24, W, 1.2, 'F');

    try { doc.addImage(LOGO_BASE64, 'PNG', 4, 4, 17, 12); } catch(e) {}
    doc.setFont('helvetica', 'bold'); doc.setFontSize(6.3); doc.setTextColor(...AMBAR);
    doc.text('CARTEIRA DE', W - 4, 8, { align: 'right' });
    doc.text('CAPACITAÇÃO', W - 4, 11.5, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(5); doc.setTextColor(200, 200, 200);
    doc.text('SEGURANÇA DO TRABALHO', W - 4, 15, { align: 'right' });

    // foto
    let y = 29;
    const fotoX = 4, fotoW = 26, fotoH = 33;
    doc.setDrawColor(...AMBAR); doc.setLineWidth(0.6);
    if (dadosFuncionario.fotoBase64) {
      try { doc.addImage(dadosFuncionario.fotoBase64, 'JPEG', fotoX, y, fotoW, fotoH, undefined, 'FAST'); } catch(e) {}
    } else {
      doc.setFillColor(...CINZA_CLARO); doc.rect(fotoX, y, fotoW, fotoH, 'F');
    }
    doc.rect(fotoX, y, fotoW, fotoH);

    // dados ao lado da foto
    const tx = fotoX + fotoW + 4;
    let ty = y + 3;
    function campo(label, valor) {
      if (!valor) return;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(5.3); doc.setTextColor(...CINZA_TXT);
      doc.text(label, tx, ty);
      ty += 3.2;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...PRETO);
      const linhas = doc.splitTextToSize(sanitizarTexto(valor), W - tx - 3);
      doc.text(linhas, tx, ty);
      ty += linhas.length * 3.4 + 3;
    }
    campo('NOME', dadosFuncionario.nome);
    campo('CPF', dadosFuncionario.cpf);
    campo('RG', dadosFuncionario.rg);
    campo('NASCIMENTO', formatarDataBR(dadosFuncionario.nascimento));

    // faixa "Nº da carteira / emissão"
    y = y + fotoH + 6;
    doc.setDrawColor(...AMBAR_ESCURO); doc.setLineWidth(0.3);
    doc.line(4, y, W - 4, y);
    y += 5;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(5.3); doc.setTextColor(...CINZA_TXT);
    doc.text('Nº DA CARTEIRA', 4, y);
    doc.text('DATA DE EMISSÃO', W/2 + 2, y);
    y += 4.5;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...AMBAR_ESCURO);
    doc.text(numeroCarteira, 4, y);
    doc.setTextColor(...PRETO);
    doc.text(dataEmissaoFmt, W/2 + 2, y);

    y += 7;
    doc.setFont('helvetica', 'italic'); doc.setFontSize(5.6); doc.setTextColor(...CINZA_TXT);
    doc.text('Empresa: ' + sanitizarTexto(dadosEmpresa.nome || ''), 4, y);
    if (dadosFuncionario.cargo) doc.text('Função: ' + sanitizarTexto(dadosFuncionario.cargo), 4, y + 4);

    // assinatura (área inferior, antes da faixa final)
    doc.setDrawColor(...CINZA_TXT); doc.setLineWidth(0.2);
    doc.line(W/2 - 2, H - 20, W - 6, H - 20);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(5); doc.setTextColor(...CINZA_TXT);
    doc.text('SAFESEG TREINAMENTOS', (W/2 - 2 + W - 6) / 2, H - 18, { align: 'center' });

    // faixa final (listrada preto/âmbar)
    const faixaY = H - 12;
    doc.setFillColor(...PRETO); doc.rect(0, faixaY, W, 12, 'F');
    doc.setFillColor(...AMBAR);
    for (let i = -2; i < W / 6 + 2; i++) doc.triangle(i*6, faixaY, i*6+3, faixaY, i*6, faixaY+2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(4.6); doc.setTextColor(...BRANCO);
    doc.text('DOCUMENTO DE IDENTIFICAÇÃO DE CAPACITAÇÃO PROFISSIONAL', W/2, faixaY + 6.5, { align: 'center' });
    doc.setTextColor(...AMBAR);
    doc.text('NÃO SUBSTITUI DOCUMENTO OFICIAL COM FOTO', W/2, faixaY + 9.5, { align: 'center' });

    /* ============================== VERSO ============================== */
    doc.addPage([85, 120], 'portrait');
    doc.setFillColor(...BRANCO); doc.rect(0, 0, W, H, 'F');

    // faixa preta lateral esquerda
    doc.setFillColor(...PRETO); doc.rect(0, 0, 10, H, 'F');
    doc.setFillColor(...AMBAR); doc.rect(10, 0, 0.8, H, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5); doc.setTextColor(...AMBAR);
    const textoLateral = 'SAFESEG TREINAMENTOS';
    const larguraLateral = doc.getTextWidth(textoLateral);
    doc.text(textoLateral, 6, H/2 + larguraLateral/2, { angle: 90 }); // sem "align:center" — quebra ao combinar com angle no jsPDF

    let vy = 8;
    const vx = 15;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...PRETO);
    doc.text('CURSOS REALIZADOS', vx, vy);
    doc.setDrawColor(...AMBAR); doc.setLineWidth(0.3);
    doc.line(vx, vy + 1.5, W - 4, vy + 1.5);
    vy += 7;

    // cabeçalho da tabela
    doc.setFillColor(...PRETO); doc.rect(vx, vy - 3.5, W - vx - 4, 5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(4.6); doc.setTextColor(...AMBAR);
    doc.text('CURSO', vx + 1, vy);
    doc.text('CARGA', vx + 33, vy);
    doc.text('REALIZ.', vx + 44, vy);
    doc.text('VALIDADE', vx + 56, vy);
    vy += 5;

    doc.setFont('helvetica', 'normal'); doc.setFontSize(5.2);
    if (cursosAtivos.length === 0) {
      doc.setTextColor(...CINZA_TXT); doc.setFont('helvetica', 'italic');
      doc.text('Nenhum treinamento registrado ainda.', vx, vy);
    } else {
      cursosAtivos.forEach((c, i) => {
        if (vy > H - 46) return; // reserva espaço pro QR/rodapé
        const st = statusPorData(c.validade);
        const catInfo = catalogoMap[normaliza(c.nr)];
        const ch = catInfo ? catInfo.ch : '';
        const realizacao = formatarDataBR(c.dataConclusao) || formatarDataBR(c.criadoEm ? c.criadoEm.slice(0,10) : '');

        if (i % 2 === 1) { doc.setFillColor(248, 246, 240); doc.rect(vx, vy - 3, W - vx - 4, 4.6, 'F'); }

        doc.setFont('helvetica', 'bold'); doc.setTextColor(...PRETO); doc.setFontSize(4.6);
        const nomeCurto = doc.splitTextToSize(sanitizarTexto(c.nr || ''), 30)[0];
        doc.text(nomeCurto, vx + 1, vy);
        doc.setFont('helvetica', 'normal'); doc.setTextColor(...CINZA_TXT);
        doc.text(ch || '-', vx + 33, vy);
        doc.text(realizacao || '-', vx + 44, vy);
        doc.setTextColor(...st.cor);
        doc.text(c.validade || '-', vx + 56, vy);
        vy += 4.8;
      });
    }

    // texto descritivo
    vy = H - 44;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(5); doc.setTextColor(...CINZA_TXT);
    const textoDesc = 'Esta carteira comprova que o profissional identificado esta capacitado conforme os treinamentos realizados e normas regulamentadoras vigentes.';
    doc.text(doc.splitTextToSize(sanitizarTexto(textoDesc), W - vx - 4), vx, vy);

    // QR code
    const qrBase64 = await buscarQrCodeBase64(cpfLimpo);
    const qrY = H - 32;
    if (qrBase64) {
      try { doc.addImage(qrBase64, 'PNG', vx, qrY, 20, 20); } catch(e) {}
    } else {
      doc.setDrawColor(...CINZA_TXT); doc.rect(vx, qrY, 20, 20);
    }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(4.6); doc.setTextColor(...PRETO);
    doc.text('Verifique a autenticidade em:', vx + 23, qrY + 8);
    doc.setTextColor(...AMBAR_ESCURO);
    doc.text('safesegtreinamentos.github.io', vx + 23, qrY + 11.5);
    doc.text('/Central/validador', vx + 23, qrY + 14.5);

    // rodapé preto com contato
    const rodapeY = H - 8;
    doc.setFillColor(...PRETO); doc.rect(0, rodapeY, W, 8, 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(4.3); doc.setTextColor(...BRANCO);
    doc.text('(46) 99920-3945  ·  contato@safeseg.eng.br', W/2, rodapeY + 5, { align: 'center' });

    const nomeArquivoPdf = `Carteirinha_${(dadosFuncionario.nome||'colaborador').replace(/[^a-zA-Z0-9]/g,'_')}.pdf`;
    doc.save(nomeArquivoPdf);
    salvarNoDriveEmSegundoPlano('carteirinha', nomeArquivoPdf, doc.output('datauristring'), dadosEmpresa.nome);
    botao.disabled = false; botao.textContent = textoOriginal;
  };

  async function salvarNoDriveEmSegundoPlano(tipo, nomeArquivo, dataUriString, empresaNome, mimeType) {
    try {
      const base64 = dataUriString.split(',')[1];
      const CERT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz55Li88oyroPtFH1iTOV2nR58-xbuUAMkGcyb6GRzM3S6KQNARj7Sxvi1mZShhPg-WRg/exec';
      const res = await fetch(CERT_APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ acao: 'salvarDocumento', tipo, nomeArquivo, conteudoBase64: base64, mimeType: mimeType || 'application/pdf', empresaNome })
      });
      const data = await res.json();
      if (!data.sucesso) console.error('Não consegui salvar no Drive:', data.erro);
    } catch (err) {
      console.error('Erro ao salvar no Drive (o download local funcionou normalmente):', err);
    }
  }

  carregar();
</script>
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>
