<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Carteirinha</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body { background: var(--paper-50); min-height: 100vh; padding: var(--space-6); }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-4); align-items: center; }
  .logo-top { max-width: 140px; }
  h1 { font-family: var(--font-display); font-size: 1.5rem; text-align: center; }
  .sub { color: var(--graphite-600); font-size: 13px; text-align: center; margin-top: -8px; }

  /* Pré-visualização das duas faces, em proporção de carteirinha (85.6 x 54mm) */
  .card-preview {
    width: 100%; max-width: 420px; aspect-ratio: 85.6 / 54;
    background: linear-gradient(135deg, #14171B 0%, #1f242b 100%);
    border-radius: 12px; box-shadow: var(--shadow-card); color: #fff;
    padding: 14px; display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .card-preview::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: repeating-linear-gradient(45deg, #F59E0B, #F59E0B 8px, #14171B 8px, #14171B 16px);
  }
  .card-top { display: flex; gap: 12px; margin-top: 8px; align-items: center; }
  .card-foto { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid #F59E0B; background: #333; flex-shrink: 0; }
  .card-foto-placeholder { width: 52px; height: 52px; border-radius: 50%; background: #333; border: 2px solid #F59E0B; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .card-nome { font-weight: 800; font-size: 14px; line-height: 1.2; }
  .card-meta { font-size: 10px; color: #ccc; margin-top: 2px; }
  .card-titulo { font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #F59E0B; font-weight: 700; margin-top: auto; }

  .card-back { background: #fff; color: #14171B; border: 1px solid var(--paper-200); }
  .card-back-header { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--gold-700); border-bottom: 1px solid var(--paper-200); padding-bottom: 4px; margin-bottom: 6px; }
  .card-curso-linha { display: flex; justify-content: space-between; font-size: 8.5px; padding: 2px 0; border-bottom: 1px dotted var(--paper-200); }
  .card-curso-nome { font-weight: 600; max-width: 60%; }
  .card-curso-data { color: var(--graphite-600); }

  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo-top" src="../assets/img/logo-dark.png" alt="SafeSeg">
  <h1>Carteirinha de Treinamentos</h1>
  <div class="sub" id="subInfo">Carregando...</div>

  <div id="cardsArea" style="display:flex; flex-direction:column; gap:16px; width:100%; align-items:center;">
    <div class="card-preview" id="cardFrente">
      <div class="card-top">
        <img class="card-foto" id="previewFoto" style="display:none;">
        <div class="card-foto-placeholder" id="previewFotoPlaceholder">👤</div>
        <div>
          <div class="card-nome" id="previewNome">—</div>
          <div class="card-meta" id="previewCargo">—</div>
          <div class="card-meta" id="previewEmpresa">—</div>
        </div>
      </div>
      <div class="card-titulo">SafeSeg · Carteirinha de Treinamentos</div>
    </div>

    <div class="card-preview card-back" id="cardVerso">
      <div class="card-back-header">Treinamentos Concluídos</div>
      <div id="previewCursos" style="overflow-y:auto; flex:1;"></div>
    </div>
  </div>

  <div class="btns">
    <button class="btn btn--primary" onclick="gerarPDFCarteirinha()">📄 Baixar PDF (tamanho CNH)</button>
    <a href="#" id="linkVoltar" class="btn btn--secondary" style="text-decoration:none;">← Voltar</a>
  </div>
</div>

<script type="module">
  import { db, collection, getDocs, doc, getDoc, esperarAuth } from '../assets/js/firebase-init.js';

  const params = new URLSearchParams(location.search);
  const empresaId = params.get('empresaId');
  const funcionarioId = params.get('funcionarioId');
  document.getElementById('linkVoltar').href = empresaId ? `empresa-detalhe.html?id=${empresaId}` : 'empresas.html';

  let dadosFuncionario = null;
  let dadosEmpresa = null;
  let cursosAtivos = [];

  function statusPorData(dataStr) {
    if (!dataStr) return { cls: 'pending', label: 'Pendente' };
    const venc = new Date(dataStr.split('/').reverse().join('-'));
    const dias = (venc - new Date()) / 86400000;
    if (dias < 0) return { cls: 'danger', label: 'Vencido' };
    if (dias <= 60) return { cls: 'warn', label: 'Atenção' };
    return { cls: 'ok', label: 'Válido' };
  }

  async function carregar() {
    const sub = document.getElementById('subInfo');
    if (!empresaId || !funcionarioId) {
      sub.textContent = '⚠️ Link incompleto — volta na tela do funcionário e clica em "🪪 Carteirinha" de novo.';
      return;
    }
    await esperarAuth();
    try {
      const [funcSnap, empSnap, certSnap] = await Promise.all([
        getDoc(doc(db, 'empresas', empresaId, 'funcionarios', funcionarioId)),
        getDoc(doc(db, 'empresas', empresaId)),
        getDocs(collection(db, 'empresas', empresaId, 'certificados'))
      ]);

      if (!funcSnap.exists()) { sub.textContent = '⚠️ Funcionário não encontrado.'; return; }
      dadosFuncionario = funcSnap.data();
      dadosEmpresa = empSnap.exists() ? empSnap.data() : { nome: '' };

      const normaliza = s => (s||'').toString().toLowerCase().trim();
      cursosAtivos = certSnap.docs
        .map(d => d.data())
        .filter(c => normaliza(c.colaborador) === normaliza(dadosFuncionario.nome))
        .filter(c => !c.substituidoPor) // só o mais recente de cada renovação
        .sort((a,b) => {
          const da = a.validade ? new Date(a.validade.split('/').reverse().join('-')) : new Date(0);
          const db_ = b.validade ? new Date(b.validade.split('/').reverse().join('-')) : new Date(0);
          return da - db_;
        });

      renderPreview();
      sub.textContent = `${dadosFuncionario.nome} · ${dadosEmpresa.nome || ''} · ${cursosAtivos.length} treinamento(s)`;
    } catch (err) {
      sub.textContent = '⚠️ Erro: ' + err.message;
      console.error(err);
    }
  }

  function renderPreview() {
    document.getElementById('previewNome').textContent = dadosFuncionario.nome || '—';
    document.getElementById('previewCargo').textContent = dadosFuncionario.cargo || 'Colaborador';
    document.getElementById('previewEmpresa').textContent = dadosEmpresa.nome || '—';

    if (dadosFuncionario.fotoBase64) {
      document.getElementById('previewFoto').src = dadosFuncionario.fotoBase64;
      document.getElementById('previewFoto').style.display = 'block';
      document.getElementById('previewFotoPlaceholder').style.display = 'none';
    }

    const box = document.getElementById('previewCursos');
    if (cursosAtivos.length === 0) {
      box.innerHTML = '<div class="text-muted" style="font-size:9px;">Nenhum treinamento registrado ainda.</div>';
      return;
    }
    box.innerHTML = cursosAtivos.map(c => {
      const st = statusPorData(c.validade);
      const cor = st.cls === 'danger' ? '#dc2626' : st.cls === 'warn' ? '#d97706' : '#16a34a';
      return `<div class="card-curso-linha">
        <span class="card-curso-nome">${c.nr}${c.origem === 'externo' ? ' 🌐' : ''}</span>
        <span class="card-curso-data" style="color:${cor};">${c.validade || '—'}</span>
      </div>`;
    }).join('');
  }

  window.gerarPDFCarteirinha = async function() {
    if (!dadosFuncionario) { alert('Aguarda carregar os dados primeiro.'); return; }
    const { jsPDF } = window.jspdf;
    // tamanho de uma CNH/cartão de crédito: 85.6mm x 54mm
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
    const W = 85.6, H = 54;
    const AMBAR = [245, 158, 11], GRAFITE = [20, 23, 27], BRANCO = [255,255,255], CINZA = [90,90,90];

    // ---------- FACE 1 — foto + identificação ----------
    doc.setFillColor(...GRAFITE); doc.rect(0, 0, W, H, 'F');
    doc.setFillColor(...AMBAR); doc.rect(0, 0, W, 2.2, 'F');

    // foto (se tiver) — círculo simulado com um retângulo arredondado
    if (dadosFuncionario.fotoBase64) {
      try {
        doc.addImage(dadosFuncionario.fotoBase64, 'JPEG', 5, 8, 18, 18, undefined, 'FAST');
      } catch (e) { /* segue sem foto se der erro de formato */ }
    } else {
      doc.setDrawColor(...AMBAR); doc.setLineWidth(0.4);
      doc.rect(5, 8, 18, 18);
    }
    doc.setDrawColor(...AMBAR); doc.setLineWidth(0.5);
    doc.rect(5, 8, 18, 18);

    doc.setTextColor(...BRANCO);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    const nomeLinhas = doc.splitTextToSize(sanitizarTexto(dadosFuncionario.nome || ''), W - 30);
    doc.text(nomeLinhas, 27, 13);

    doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
    doc.setTextColor(200, 200, 200);
    doc.text(sanitizarTexto(dadosFuncionario.cargo || 'Colaborador'), 27, 13 + nomeLinhas.length * 4 + 2);
    doc.text(sanitizarTexto(dadosEmpresa.nome || ''), 27, 13 + nomeLinhas.length * 4 + 7);

    doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5);
    doc.setTextColor(...AMBAR);
    doc.text('SAFESEG · CARTEIRINHA DE TREINAMENTOS', 5, H - 4);

    // ---------- FACE 2 — lista de treinamentos ----------
    doc.addPage([85.6, 54], 'landscape');
    doc.setFillColor(...BRANCO); doc.rect(0, 0, W, H, 'F');
    doc.setFillColor(...AMBAR); doc.rect(0, 0, W, 2.2, 'F');

    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
    doc.setTextColor(...GRAFITE);
    doc.text('TREINAMENTOS CONCLUÍDOS', 5, 8);
    doc.setDrawColor(...AMBAR); doc.setLineWidth(0.3);
    doc.line(5, 9.5, W - 5, 9.5);

    let y = 14;
    doc.setFontSize(6.5);
    if (cursosAtivos.length === 0) {
      doc.setFont('helvetica', 'italic'); doc.setTextColor(...CINZA);
      doc.text('Nenhum treinamento registrado ainda.', 5, y);
    } else {
      cursosAtivos.forEach(c => {
        if (y > H - 6) return; // não deixa estourar o cartão — cabe o que cabe
        const st = statusPorData(c.validade);
        const cor = st.cls === 'danger' ? [220,38,38] : st.cls === 'warn' ? [217,119,6] : [22,163,74];

        doc.setFont('helvetica', 'bold'); doc.setTextColor(...GRAFITE);
        const nomeCurso = doc.splitTextToSize(sanitizarTexto(c.nr || ''), W - 28);
        doc.text(nomeCurso[0], 5, y);

        doc.setFont('helvetica', 'normal'); doc.setTextColor(...cor);
        doc.text(c.validade || '—', W - 5, y, { align: 'right' });

        y += 4.2;
      });
    }

    doc.setFont('helvetica', 'normal'); doc.setFontSize(5.5); doc.setTextColor(...CINZA);
    doc.text('SafeSeg Segurança do Trabalho · (46) 99920-3945', 5, H - 3);

    doc.save(`Carteirinha_${(dadosFuncionario.nome||'colaborador').replace(/[^a-zA-Z0-9]/g,'_')}.pdf`);
  };

  function sanitizarTexto(s) {
    return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^ -~]/g, '');
  }

  carregar();
</script>
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>

</body>
</html>
