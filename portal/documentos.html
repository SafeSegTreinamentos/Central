<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Documentos</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: #fff; border-bottom: 1px solid var(--paper-200);
    padding: var(--space-4) var(--space-6);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3);
  }
  .topbar h1 { font-size: var(--text-xl); letter-spacing: 0.03em; }
  .topbar .sub { font-size: var(--text-sm); color: var(--graphite-600); margin-top: 2px; }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); }
  .filter-tabs { display: flex; gap: 4px; background: var(--paper-100); padding: 4px; border-radius: var(--radius-sm); flex-wrap: wrap; }
  .filter-tab { padding: 7px 14px; border-radius: 6px; font-size: var(--text-sm); font-weight: 600; color: var(--graphite-600); background: transparent; border: none; }
  .filter-tab.active { background: #fff; color: var(--graphite-900); box-shadow: var(--shadow-card); }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--paper-200); border-radius: var(--radius-sm);
    padding: 8px 12px; background: #fff; min-width: 240px; flex: 1; max-width: 340px;
  }
  .search-box input { border: none; outline: none; flex: 1; font-family: var(--font-body); font-size: var(--text-sm); }
  .search-box svg { width: 16px; height: 16px; color: var(--graphite-600); flex-shrink: 0; }

  .collab-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .collab-card { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; }
  .collab-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); cursor: pointer; }
  .collab-avatar { width: 40px; height: 40px; border-radius: 10px; background: var(--graphite-900); color: var(--gold-300); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 15px; flex-shrink: 0; }
  .collab-info { flex: 1; min-width: 0; }
  .collab-name { font-weight: 700; font-size: var(--text-base); }
  .collab-empresa { font-size: var(--text-sm); color: var(--graphite-600); }
  .collab-summary { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chevron { width: 18px; height: 18px; color: var(--graphite-600); transition: transform 0.15s ease; flex-shrink: 0; }
  .collab-card.open .chevron { transform: rotate(180deg); }
  .collab-body { display: none; border-top: 1px solid var(--paper-200); }
  .collab-card.open .collab-body { display: block; }

  .doc-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--paper-100); }
  .doc-row:last-child { border-bottom: none; }
  .doc-cat {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 5px; text-align: center; flex-shrink: 0;
  }
  .doc-cat--pgr    { background: #EAE6F7; color: #6B4FBB; }
  .doc-cat--ltcat  { background: #E2F1F8; color: #2A7DA8; }
  .doc-cat--pcmso  { background: #FCEAD8; color: #C56A1E; }
  .doc-cat--laudo  { background: #E8F3E9; color: #3C8C4E; }
  .doc-cat--contrato { background: var(--paper-200); color: var(--graphite-700); }
  .doc-nome { flex: 1 1 auto; min-width: 120px; font-size: var(--text-sm); color: var(--graphite-700); }
  .doc-row__meta { display: flex; align-items: center; gap: var(--space-3); flex-shrink: 0; margin-left: auto; }
  .doc-data { font-family: var(--font-data); font-size: var(--text-sm); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .content { padding: var(--space-4) !important; }
    .topbar { padding: var(--space-3) var(--space-4) !important; }
    .doc-nome { white-space: normal; font-size: 13px; }
    .doc-row__meta { flex: 1 1 100%; margin-left: 0; justify-content: space-between; }
  }
</style>
</head>
<body>

<div class="app">

    <a class="nav-item" href="../index.html" style="background:var(--graphite-900); color:var(--gold-300); margin-bottom:4px;">

    </a>

    </a>
    <a class="nav-item" href="gerador-turmas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M9 18v3M15 18v3"/></svg>

    <a class="nav-item" href="tecnica.html">

    <div class="nav-section-label">Documentos &amp; Certificação</div>
    <a class="nav-item" href="certificados.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16c0-5 4-9 9-9s9 4 9 9"/><path d="M2 16h20"/><path d="M9 7V4"/></svg>

    </a>
    <a class="nav-item active" href="documentos.html">

      Documentos
    </a>
    <a class="nav-item" href="agenda-turmas.html">

    </a>
    <button class="nav-item" style="width:100%; text-align:left; border:none; background:transparent; cursor:pointer; margin-top:auto; color:var(--status-danger);" onclick="fazerLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Sair
    </button>
  </nav>

  <div class="main">
    <div class="hazard-stripe"></div>
    <header class="topbar">
      <div>
        <h1>Documentos</h1>
        <div class="sub">PGR · LTCAT · PCMSO · Laudos · Contratos — por empresa</div>
      </div>
      <div class="flex gap-2">
        <button class="btn btn--secondary" onclick="exportarDocumentosCSV()">↓ Exportar</button>
        <button class="btn btn--primary" onclick="abrirModalNovoDocumento()">+ Novo Documento</button>
      </div>
    </header>

    <div class="content">

      <div class="toolbar">
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="filtrarCategoria('Todos', this)">Todos</button>
          <button class="filter-tab" onclick="filtrarCategoria('PGR', this)">PGR</button>
          <button class="filter-tab" onclick="filtrarCategoria('LTCAT', this)">LTCAT</button>
          <button class="filter-tab" onclick="filtrarCategoria('PCMSO', this)">PCMSO</button>
          <button class="filter-tab" onclick="filtrarCategoria('Laudo', this)">Laudos</button>
          <button class="filter-tab" onclick="filtrarCategoria('Contrato', this)">Contratos</button>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>

      <div class="collab-list" id="docList"></div>

    </div>

</div>

<!-- MODAL: NOVO DOCUMENTO -->
<div id="modalNovoDocOverlay" style="display:none; position:fixed; inset:0; background:rgba(20,23,27,0.55); align-items:center; justify-content:center; z-index:60; padding:16px;">
  <div style="background:#fff; border-radius:16px; width:100%; max-width:440px; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
    <div style="padding:20px; border-bottom:1px solid var(--paper-200); display:flex; align-items:center; justify-content:space-between;">
      <h3 style="font-family:var(--font-display); font-size:1.2rem; margin:0;">Novo Documento</h3>
      <button onclick="fecharModalNovoDocumento()" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--graphite-600);">✕</button>
    </div>
    <div style="padding:20px; display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Empresa</label>
        <select id="novoDocEmpresa" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;"></select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Categoria</label>
        <select id="novoDocCategoria" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
          <option value="PGR">PGR</option>
          <option value="LTCAT">LTCAT</option>
          <option value="PCMSO">PCMSO</option>
          <option value="Laudo">Laudo</option>
          <option value="Contrato">Contrato</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Nome do documento</label>
        <input type="text" id="novoDocNome" placeholder="Ex: PGR 2026-2028" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Validade (opcional)</label>
        <input type="date" id="novoDocValidade" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
      </div>
      <div id="novoDocErro" style="color:var(--status-danger); font-size:13px; display:none;"></div>
    </div>
    <div style="padding:16px 20px; border-top:1px solid var(--paper-200); display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn--secondary" onclick="fecharModalNovoDocumento()">Cancelar</button>
      <button class="btn btn--primary" onclick="salvarNovoDocumento()">Salvar documento</button>
    </div>
  </div>
</div>

<script type="module">
  import { db, collection, getDocs, addDoc, esperarAuth } from '../assets/js/firebase-init.js';

  // Documentos vivem em: empresas/{id}/documentos (subcoleção criada do zero,
  // mesmo padrão de certificados — coleção não existia antes).
  function pick(obj, ...keys) {
    for (const k of keys) if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
    return null;
  }
  function iniciais(nome) {
    return (nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
  }
  function statusPorData(dataStr) {
    if (!dataStr) return { cls: 'pending', label: 'Pendente' };
    const venc = new Date(dataStr.split('/').reverse().join('-'));
    const dias = (venc - new Date()) / 86400000;
    if (dias < 0) return { cls: 'danger', label: 'Vencido' };
    if (dias <= 60) return { cls: 'warn', label: 'Atenção' };
    return { cls: 'ok', label: 'Válido' };
  }
  function catClass(cat) {
    const c = (cat || '').toLowerCase();
    if (c.includes('pgr')) return 'pgr';
    if (c.includes('ltcat')) return 'ltcat';
    if (c.includes('pcmso')) return 'pcmso';
    if (c.includes('contrato')) return 'contrato';
    return 'laudo';
  }

  async function carregarDocumentos() {
    const status = document.getElementById('connStatus');
    const box = document.getElementById('docList');

    const user = await esperarAuth();
    if (!user) {
      status.textContent = '🔒 Você precisa estar logado pra ver os documentos.';
      status.style.color = 'var(--status-warn)';
      return;
    }

    try {
      const empresasSnap = await getDocs(collection(db, 'empresas'));
      if (empresasSnap.empty) {
        status.textContent = 'Nenhuma empresa cadastrada ainda.';
        return;
      }

      const empresasComDocs = await Promise.all(empresasSnap.docs.map(async empDoc => {
        const emp = empDoc.data();
        const docSnap = await getDocs(collection(db, 'empresas', empDoc.id, 'documentos'));
        const documentos = [];
        docSnap.forEach(d => {
          const dt = d.data();
          documentos.push({
            categoria: pick(dt, 'categoria', 'tipo', 'cat') || 'Laudo',
            nome: pick(dt, 'nome', 'titulo', 'descricao') || '(sem nome)',
            data: pick(dt, 'validade', 'dataVencimento', 'vencimento')
          });
        });
        return { id: empDoc.id, nome: emp.nome || '(sem nome)', documentos };
      }));

      window.__empresasDocumentos = empresasComDocs;

      // popula o seletor de empresa do modal "Novo Documento"
      const selectModal = document.getElementById('novoDocEmpresa');
      if (selectModal) {
        selectModal.innerHTML = empresasComDocs.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
      }

      const comDoc = empresasComDocs.filter(e => e.documentos.length > 0);
      if (comDoc.length === 0) {
        status.textContent = 'Conectado — nenhum documento cadastrado ainda.';
        return;
      }

      renderDocumentosFiltrados();

      status.textContent = `${comDoc.length} empresa(s) com documento cadastrado.`;
      status.style.color = 'var(--status-ok)';
    } catch (err) {
      console.error('Erro ao carregar documentos:', err);
      status.textContent = `⚠️ Erro ao carregar: ${err.message}`;
      status.style.color = 'var(--status-danger)';
    }
  }

  let filtroCategoriaAtual = 'Todos';
  window.filtrarCategoria = function(cat, btn) {
    filtroCategoriaAtual = cat;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderDocumentosFiltrados();
  };

  window.renderDocumentosFiltrados = function() {
    const box = document.getElementById('docList');
    const todasEmpresas = window.__empresasDocumentos || [];
    const busca = (document.getElementById('buscaDocumento').value || '').toLowerCase().trim();

    const filtradas = todasEmpresas.map(emp => {
      let documentos = filtroCategoriaAtual === 'Todos'
        ? emp.documentos
        : emp.documentos.filter(d => catClass(d.categoria) === catClass(filtroCategoriaAtual));
      if (busca) {
        documentos = documentos.filter(d =>
          d.nome.toLowerCase().includes(busca) || emp.nome.toLowerCase().includes(busca));
      }
      return { ...emp, documentos };
    }).filter(emp => emp.documentos.length > 0);

    if (filtradas.length === 0) {
      box.innerHTML = '<div class="text-muted" style="text-align:center; padding:20px;">Nenhum documento encontrado com esse filtro.</div>';
      return;
    }

    box.innerHTML = filtradas.map((emp, i) => {
      const counts = { danger: 0, warn: 0, ok: 0, pending: 0 };
      emp.documentos.forEach(d => counts[statusPorData(d.data).cls]++);
      const resumoHtml = Object.entries(counts).filter(([,n]) => n > 0)
        .map(([cls, n]) => `<span class="selo selo--${cls}">${n} ${cls==='ok'?'válido(s)':cls==='danger'?'vencido(s)':cls==='warn'?'atenção':'pendente(s)'}</span>`).join('');

      const rowsHtml = emp.documentos.map(d => {
        const st = statusPorData(d.data);
        return `<div class="doc-row"><span class="doc-cat doc-cat--${catClass(d.categoria)}">${d.categoria}</span><span class="doc-nome">${d.nome}</span><div class="doc-row__meta"><span class="doc-data">${d.data || '—'}</span><span class="selo selo--${st.cls}">${st.label}</span></div></div>`;
      }).join('');

      return `
        <div class="collab-card ${i === 0 ? 'open' : ''}">
          <div class="collab-head" onclick="this.parentElement.classList.toggle('open')">
            <div class="collab-avatar">${iniciais(emp.nome)}</div>
            <div class="collab-info">
              <div class="collab-name">${emp.nome}</div>
              <div class="collab-empresa">${emp.documentos.length} documento(s) cadastrado(s)</div>
            </div>
            <div class="collab-summary">${resumoHtml}</div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="collab-body">${rowsHtml}</div>
        </div>`;
    }).join('');
  };

  window.exportarDocumentosCSV = function() {
    const todasEmpresas = window.__empresasDocumentos || [];
    const linhas = [['Empresa', 'Categoria', 'Documento', 'Validade', 'Status']];
    todasEmpresas.forEach(emp => emp.documentos.forEach(d => {
      const st = statusPorData(d.data);
      linhas.push([emp.nome, d.categoria, d.nome, d.data || '', st.label]);
    }));
    if (linhas.length === 1) { alert('Nada pra exportar ainda.'); return; }
    const csv = linhas.map(l => l.map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `safeseg-documentos-${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  };

  window.abrirModalNovoDocumento = function() {
    document.getElementById('modalNovoDocOverlay').style.display = 'flex';
  };
  window.fecharModalNovoDocumento = function() {
    document.getElementById('modalNovoDocOverlay').style.display = 'none';
  };
  window.salvarNovoDocumento = async function() {
    const empresaId = document.getElementById('novoDocEmpresa').value;
    const categoria = document.getElementById('novoDocCategoria').value;
    const nome = document.getElementById('novoDocNome').value.trim();
    const validade = document.getElementById('novoDocValidade').value;
    const erroBox = document.getElementById('novoDocErro');
    erroBox.style.display = 'none';

    if (!empresaId || !nome) {
      erroBox.textContent = 'Escolhe a empresa e digita o nome do documento.';
      erroBox.style.display = 'block';
      return;
    }

    // converte AAAA-MM-DD (input date) pra DD/MM/AAAA (formato usado no resto do sistema)
    let validadeFmt = '';
    if (validade) { const [y,m,d] = validade.split('-'); validadeFmt = `${d}/${m}/${y}`; }

    try {
      await addDoc(collection(db, 'empresas', empresaId, 'documentos'), {
        categoria, nome, validade: validadeFmt
      });
      fecharModalNovoDocumento();
      document.getElementById('novoDocNome').value = '';
      document.getElementById('novoDocValidade').value = '';
      carregarDocumentos();
    } catch (err) {
      erroBox.textContent = 'Erro ao salvar: ' + err.message;
      erroBox.style.display = 'block';
    }
  };

  carregarDocumentos();
</script>
<!-- Script de logout — independente, funciona mesmo se o resto da página falhar -->
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>

</body>
