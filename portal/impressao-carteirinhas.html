<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Impressão de Carteirinhas</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; border-bottom: 1px solid var(--paper-200); padding: var(--space-4) var(--space-6); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--space-3); }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); max-width: 900px; }
  .card { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-5); }
  .field label { font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px; }
  .field select { width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px; }
  .aluno-row { display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--paper-200); border-radius:8px; margin-bottom:8px; }
  .aluno-row .nome { font-weight:700; font-size:13.5px; }
  .aluno-row .sub { font-size:11.5px; color:var(--graphite-600); font-family: var(--font-data); }
</style>
<script src="../assets/js/menu.js" defer></script>
</head>
<body>

<div class="app">
  <nav class="sidebar" data-menu="admin"></nav>

  <div class="main">
    <div class="hazard-stripe"></div>
    <header class="topbar">
      <div>
        <h1>Impressão de Carteirinhas</h1>
        <div class="sub" id="topbarSub" style="font-size:13px; color:var(--graphite-600);">Ferramenta só pra admin — escolhe a empresa e os funcionários, e gera exatamente o mesmo modelo da emissão individual (8,5 x 5,4cm), um PDF só com todos, na ordem selecionada</div>
      </div>
      <button class="btn btn--primary" onclick="gerarCarteirinhasSelecionadas()">📄 Gerar Carteirinhas</button>
    </header>

    <div class="content">
      <div id="connStatus" class="text-muted" style="font-size:12px;">Conectando...</div>

      <div class="card">
        <div class="field" style="margin-bottom:14px;">
          <label>Empresa</label>
          <select id="empresaSelect" onchange="carregarFuncionarios()"></select>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <strong style="font-size:13.5px;">Funcionários</strong>
          <span class="text-muted" style="font-size:11.5px;" id="contadorSelecionados"></span>
        </div>
        <div id="funcionariosList" class="text-muted" style="font-size:13px;">Escolhe uma empresa primeiro.</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { db, collection, getDocs, esperarAuth } from '../assets/js/firebase-init.js';

  let empresaIdAtual = null;
  let funcionariosCache = [];

  async function carregar() {
    const status = document.getElementById('connStatus');
    await esperarAuth();
    try {
      const snap = await getDocs(collection(db, 'empresas'));
      const empresasCache = snap.docs.map(d => ({ id: d.id, nome: d.data().nome || '(sem nome)' })).sort((a,b) => a.nome.localeCompare(b.nome));
      document.getElementById('empresaSelect').innerHTML = '<option value="">— Escolhe a empresa —</option>' +
        empresasCache.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');

      status.textContent = '✅ Carregado.';
      status.style.color = 'var(--status-ok)';
    } catch (err) {
      status.textContent = '⚠️ Erro: ' + err.message;
      console.error(err);
    }
  }

  // ---------- Seleção de funcionários ----------
  window.carregarFuncionarios = async function() {
    const empresaId = document.getElementById('empresaSelect').value;
    const listBox = document.getElementById('funcionariosList');
    empresaIdAtual = empresaId || null;
    if (!empresaId) {
      funcionariosCache = [];
      listBox.innerHTML = '<div class="text-muted" style="font-size:13px;">Escolhe uma empresa primeiro.</div>';
      atualizarContador();
      return;
    }
    listBox.innerHTML = 'Carregando...';
    try {
      const funcSnap = await getDocs(collection(db, 'empresas', empresaId, 'funcionarios'));
      funcionariosCache = funcSnap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(f => f.status !== 'inativo')
        .map(f => ({ id: f.id, nome: f.nome || '', cpf: f.cpf || '', selecionado: false }))
        .sort((a, b) => a.nome.localeCompare(b.nome));
      renderFuncionarios();
    } catch (err) {
      listBox.innerHTML = '⚠️ Erro ao carregar: ' + err.message;
      console.error(err);
    }
  };

  function renderFuncionarios() {
    const listBox = document.getElementById('funcionariosList');
    if (funcionariosCache.length === 0) {
      listBox.innerHTML = '<div class="text-muted" style="font-size:13px;">Nenhum funcionário ativo cadastrado nessa empresa ainda.</div>';
      atualizarContador();
      return;
    }
    listBox.innerHTML = funcionariosCache.map((f, i) => `
      <div class="aluno-row">
        <input type="checkbox" ${f.selecionado ? 'checked' : ''} onchange="alternarFuncionario(${i}, this.checked)" style="cursor:pointer;">
        <div class="info" style="flex:1;">
          <div class="nome">${f.nome}</div>
          <div class="sub">${f.cpf || '—'}</div>
        </div>
      </div>`).join('');
    atualizarContador();
  }
  function atualizarContador() {
    const n = funcionariosCache.filter(f => f.selecionado).length;
    document.getElementById('contadorSelecionados').textContent = n > 0 ? `${n} selecionado(s)` : '';
  }
  window.alternarFuncionario = function(idx, valor) {
    funcionariosCache[idx].selecionado = valor;
    atualizarContador();
  };

  // Não desenha PDF nenhum aqui — abre o carteirinha.html com os IDs
  // selecionados, que é quem realmente gera o PDF. Assim a carteirinha
  // em lote sai IDÊNTICA à emissão individual, sempre (mesmo código,
  // mesmo modelo, mesmo salvamento no Drive) — nunca corre o risco de
  // desalinhar as duas telas de novo.
  window.gerarCarteirinhasSelecionadas = function() {
    if (!empresaIdAtual) { alert('Escolhe uma empresa primeiro.'); return; }
    const ids = funcionariosCache.filter(f => f.selecionado).map(f => f.id);
    if (ids.length === 0) { alert('Marca pelo menos um funcionário antes de gerar.'); return; }
    window.open(`carteirinha.html?empresaId=${empresaIdAtual}&funcionarioIds=${ids.join(',')}`, '_blank');
  };

  carregar();
</script>
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>

</body>
</html>
