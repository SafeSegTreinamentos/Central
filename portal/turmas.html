<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Turmas</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: #fff; border-bottom: 1px solid var(--paper-200);
    padding: var(--space-4) var(--space-6);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3);
  }
  .topbar h1 { font-size: var(--text-xl); letter-spacing: 0.03em; }
  .topbar .sub { font-size: var(--text-sm); color: var(--graphite-600); margin-top: 2px; }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); max-width: 1000px; }

  .turma-card { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; }
  .turma-head { padding: var(--space-4) var(--space-5); display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); cursor: pointer; flex-wrap: wrap; }
  .turma-head:hover { background: var(--paper-50); }
  .turma-code { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: .02em; }
  .turma-meta { font-size: 12.5px; color: var(--graphite-600); margin-top: 2px; }
  .turma-body { display: none; border-top: 1px solid var(--paper-100); padding: var(--space-4) var(--space-5); }
  .turma-card.open .turma-body { display: block; }
  .turma-card.open .chevron { transform: rotate(180deg); }
  .chevron { width: 18px; height: 18px; color: var(--graphite-600); transition: transform .2s; flex-shrink: 0; }

  table.aluno-table { width: 100%; border-collapse: collapse; }
  table.aluno-table th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--graphite-600); padding: 8px 10px; border-bottom: 2px solid var(--paper-200); letter-spacing: .03em; }
  table.aluno-table td { padding: 8px 10px; border-bottom: 1px solid var(--paper-100); font-size: 13.5px; vertical-align: middle; }
  table.aluno-table input[type="text"], table.aluno-table input[type="number"] {
    border: 1px solid var(--paper-200); border-radius: 5px; padding: 6px 8px; font-size: 13px; font-family: inherit; width: 100%;
  }
  .aprovado-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .aprovado-toggle input { width: 17px; height: 17px; cursor: pointer; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--graphite-600); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .content { padding: var(--space-4) !important; }
    .topbar { padding: var(--space-3) var(--space-4) !important; }
    table.aluno-table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>

  <nav class="sidebar">

      <img src="../assets/img/logo-dark.png" alt="SafeSeg" style="background:var(--graphite-900); border-radius:8px; padding:4px; max-width:150px; display:block;">
    </div>

    <a class="nav-item" href="../index.html" style="background:var(--graphite-900); color:var(--gold-300); margin-bottom:4px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>

    </a>
    <a class="nav-item" href="dashboard.html">

      Dashboard
    </a>
    <div class="nav-section-label">Gestão Interna</div>
    <a class="nav-item" href="empresas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/><path d="M19 21V10a1 1 0 0 0-1-1h-3"/><path d="M8 7h2M8 11h2M8 15h2"/></svg>
      Empresas
    </a>
    <a class="nav-item" href="gerador-turmas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M9 18v3M15 18v3"/></svg>
      Gerador de Turmas
    </a>
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
      Turmas
    </a>
    <a class="nav-item" href="tecnica.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 2a2.5 2.5 0 0 0-2.5 2.5V6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2V4.5A2.5 2.5 0 0 0 14.5 2z"/><path d="M9 12h6M9 16h4"/></svg>
      Central Técnica
    </a>
    <div class="nav-section-label">Documentos &amp; Certificação</div>
    <a class="nav-item" href="certificados.html">

    </a>
    <a class="nav-item" href="documentos.html">

  <div class="main">
    <div class="hazard-stripe"></div>
    <header class="topbar">
      <div>
        <h1>Turmas</h1>
        <div class="sub" id="topbarSub">Abre uma turma, marca nota e aprovação de cada aluno</div>
      </div>
    </header>

    <div class="content">
      <div id="turmasList"></div>
    </div>
  </div>
</div>

<script type="module">
  try {
    const { esperarAuth } = await import('../assets/js/firebase-init.js');
    await esperarAuth();
  } catch (err) {
    console.error('Erro ao verificar login:', err);
    document.body.innerHTML = `
      <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; color:#14171B; font-family:Inter,Arial,sans-serif;">
        <div>
          <div style="font-size:40px; margin-bottom:12px;">⚠️</div>
          <div style="font-size:16px; font-weight:700; margin-bottom:6px;">Não foi possível verificar o login</div>
          <div style="font-size:13px; color:#666; margin-bottom:16px;">${err.message}</div>
          <button onclick="location.reload()" style="background:#F59E0B; color:#111; border:none; padding:10px 20px; border-radius:8px; font-weight:700; cursor:pointer;">Tentar de novo</button>
        </div>
      </div>`;
  }
</script>

<script>
  const LS_TURMAS = 'safeseg_turmas_v1';
  function loadTurmas(){ try{ return JSON.parse(localStorage.getItem(LS_TURMAS)||'[]'); }catch(e){ return []; } }
  function saveTurmas(list){ localStorage.setItem(LS_TURMAS, JSON.stringify(list)); }
  function formatDateBR(iso){
    if(!iso) return '';
    const [y,m,d]=iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function renderTurmas(){
    const turmas = loadTurmas().slice().sort((a,b) => {
      const da = a.dias && a.dias[0] ? a.dias[0].date : '';
      const db = b.dias && b.dias[0] ? b.dias[0].date : '';
      return db.localeCompare(da); // mais recente primeiro
    });
    const box = document.getElementById('turmasList');

    if (turmas.length === 0) {
      box.innerHTML = `<div class="empty-state">Nenhuma turma salva ainda. Crie uma no <a href="gerador-turmas.html" style="color:var(--gold-600); font-weight:600;">Gerador de Turmas</a>.</div>`;
      return;
    }

    box.innerHTML = turmas.map((t, ti) => {
      const alunos = t.alunos || [];
      const aprovados = alunos.filter(a => a.aprovado).length;
      const linhas = alunos.map((a, ai) => `
        <tr>
          <td>${a.nome}</td>
          <td style="font-family:var(--font-data); font-size:12px;">${a.cpf || '—'}</td>
          <td><input type="text" value="${(a.nota||'').toString().replace(/"/g,'&quot;')}" placeholder="Nota (opcional)" onchange="atualizarAluno('${t.id}', ${ai}, 'nota', this.value)"></td>
          <td>
            <label class="aprovado-toggle">
              <input type="checkbox" ${a.aprovado ? 'checked' : ''} onchange="atualizarAluno('${t.id}', ${ai}, 'aprovado', this.checked)">
              ${a.aprovado ? '<span class="selo selo--ok">Aprovado</span>' : '<span class="selo selo--pending">Pendente</span>'}
            </label>
          </td>
        </tr>`).join('');

      return `
        <div class="turma-card" id="turma-${t.id}">
          <div class="turma-head" onclick="document.getElementById('turma-${t.id}').classList.toggle('open')">
            <div>
              <div class="turma-code">${t.codigo || '(sem código)'} — ${t.curso || 'Treinamento'}</div>
              <div class="turma-meta">${t.empresa || 'CT SafeSeg'} · ${alunos.length} aluno(s) · ${aprovados} aprovado(s) · ${t.dias && t.dias[0] ? formatDateBR(t.dias[0].date) : ''}</div>
            </div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="turma-body">
            ${alunos.length === 0 ? '<div class="text-muted" style="padding:10px 0;">Essa turma não tem aluno cadastrado.</div>' : `
            <table class="aluno-table">
              <thead><tr><th>Nome</th><th>CPF</th><th>Nota</th><th>Aprovação</th></tr></thead>
              <tbody>${linhas}</tbody>
            </table>`}
            <div style="margin-top:14px; display:flex; justify-content:flex-end; gap:8px;">
              <a href="gerador-turmas.html" class="btn btn--secondary" style="text-decoration:none;">Ver no Gerador de Turmas</a>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  window.atualizarAluno = function(turmaId, alunoIndex, campo, valor) {
    const turmas = loadTurmas();
    const turma = turmas.find(t => t.id === turmaId);
    if (!turma || !turma.alunos || !turma.alunos[alunoIndex]) return;
    turma.alunos[alunoIndex][campo] = valor;
    saveTurmas(turmas);
    renderTurmas(); // re-renderiza pra atualizar contagem de aprovados e o selo
    // reabre a turma que estava aberta antes de re-renderizar
    const el = document.getElementById(`turma-${turmaId}`);
    if (el) el.classList.add('open');
  };

  renderTurmas();
</script>
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>

</body>
