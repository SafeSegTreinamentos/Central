<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Certificados (Cliente)</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: #fff; border-bottom: 1px solid var(--paper-200);
    padding: var(--space-4) var(--space-6);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3);
  }
  .topbar h1 { font-size: var(--text-xl); letter-spacing: 0.03em; }
  .topbar .sub { font-size: var(--text-sm); color: var(--graphite-600); margin-top: 2px; }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); }
  .filter-tabs { display: flex; gap: 4px; background: var(--paper-100); padding: 4px; border-radius: var(--radius-sm); }
  .filter-tab { padding: 7px 16px; border-radius: 6px; font-size: var(--text-sm); font-weight: 600; color: var(--graphite-600); background: transparent; border: none; }
  .filter-tab.active { background: #fff; color: var(--graphite-900); box-shadow: var(--shadow-card); }
  .filter-tab .count { font-family: var(--font-data); font-size: 11px; margin-left: 4px; color: var(--graphite-600); }

  .search-box { display: flex; align-items: center; gap: 8px; border: 1px solid var(--paper-200); border-radius: var(--radius-sm); padding: 8px 12px; background: #fff; min-width: 240px; flex: 1; max-width: 340px; }
  .search-box input { border: none; outline: none; flex: 1; font-family: var(--font-body); font-size: var(--text-sm); }
  .search-box svg { width: 16px; height: 16px; color: var(--graphite-600); flex-shrink: 0; }

  .collab-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .collab-card { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; }
  .collab-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); cursor: pointer; }
  .collab-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--graphite-900); color: var(--gold-300); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 15px; flex-shrink: 0; }
  .collab-info { flex: 1; min-width: 0; }
  .collab-name { font-weight: 700; font-size: var(--text-base); }
  .collab-empresa { font-size: var(--text-sm); color: var(--graphite-600); }
  .collab-summary { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chevron { width: 18px; height: 18px; color: var(--graphite-600); transition: transform 0.15s ease; flex-shrink: 0; }
  .collab-card.open .chevron { transform: rotate(180deg); }
  .collab-body { display: none; border-top: 1px solid var(--paper-200); }
  .collab-card.open .collab-body { display: block; }
  .cert-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--paper-100); }
  .cert-row:last-child { border-bottom: none; }
  .cert-nr { font-family: var(--font-data); font-weight: 700; font-size: var(--text-sm); flex-shrink: 0; }
  .cert-nome { flex: 1 1 auto; min-width: 120px; font-size: var(--text-sm); color: var(--graphite-700); }
  .cert-row__meta { display: flex; align-items: center; gap: var(--space-3); flex-shrink: 0; margin-left: auto; }
  .cert-data { font-family: var(--font-data); font-size: var(--text-sm); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .sidebar { flex-direction: row; align-items: center; overflow-x: auto; padding: var(--space-2) var(--space-3); gap: var(--space-2); white-space: nowrap; }
    .sidebar__logo { padding: 0 var(--space-3) 0 0; flex-shrink: 0; }
    .sidebar__logo img { max-width: 80px; }
    .nav-section-label { display: none; }
    .nav-item { flex-direction: column; gap: 2px; padding: 6px 10px; font-size: 10px; text-align: center; }
    .content { padding: var(--space-4) !important; }
    .topbar { padding: var(--space-3) var(--space-4) !important; }
    .collab-summary { justify-content: flex-start; }
    .cert-nome { white-space: normal; font-size: 13px; }
    .cert-row__meta { flex: 1 1 100%; margin-left: 0; justify-content: space-between; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar__logo">
      <img src="../assets/img/logo-dark.png" alt="SafeSeg" style="background:var(--graphite-900); border-radius:8px; padding:4px; max-width:150px; display:block;">
    </div>
    <a class="nav-item" href="dashboard-cliente.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>
    <div class="nav-section-label">Documentos &amp; Certificação</div>
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16c0-5 4-9 9-9s9 4 9 9"/><path d="M2 16h20"/><path d="M9 7V4"/></svg>
      Certificados
    </a>
    <a class="nav-item" href="agenda-cliente.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="7" rx="2"/><path d="M9 10v4M15 10v4M6 14h12v7H6z"/></svg>
      Agenda de Turmas
    </a>
    <button class="nav-item" style="width:100%; text-align:left; border:none; background:transparent; cursor:pointer; margin-top:auto; color:var(--status-danger);" onclick="fazerLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Sair
    </button>
  </nav>

  <div class="main">
    <div class="hazard-stripe"></div>
    <header class="topbar">
      <div>
        <h1>Certificados</h1>
        <div class="sub" id="topbarSub">Carregando...</div>
      </div>
      <div class="flex gap-2">
        <button class="btn btn--secondary">↓ Exportar</button>
      </div>
    </header>

    <div class="content">

      <div id="connStatus" class="text-muted" style="font-size:12px; margin-bottom:-8px;">Conectando...</div>

      <div class="toolbar">
        <div class="filter-tabs">
          <button class="filter-tab active">Todos <span class="count" id="countTodos"></span></button>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="text" placeholder="Buscar colaborador...">
        </div>
      </div>

      <div class="collab-list" id="collabList"></div>

    </div>
  </div>
</div>

<script type="module">
  import { db, collection, getDocs, obterMeuPerfil } from '../assets/js/firebase-init.js';

  function pick(obj, ...keys) {
    for (const k of keys) if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
    return null;
  }
  function statusPorData(dataStr) {
    if (!dataStr) return { cls: 'pending', label: 'Pendente' };
    const venc = new Date(dataStr.split('/').reverse().join('-'));
    const dias = (venc - new Date()) / 86400000;
    if (dias < 0) return { cls: 'danger', label: 'Vencido' };
    if (dias <= 60) return { cls: 'warn', label: 'Atenção' };
    return { cls: 'ok', label: 'Válido' };
  }
  function iniciais(nome) {
    return (nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
  }

  async function carregarCertificados() {
    const status = document.getElementById('connStatus');
    const box = document.getElementById('collabList');

    const perfil = await obterMeuPerfil();
    if (!perfil) {
      status.textContent = '🔒 Você precisa estar logado pra ver os certificados.';
      status.style.color = 'var(--status-warn)';
      return;
    }
    if (perfil.role !== 'cliente' || !perfil.empresaId) {
      status.textContent = '⚠️ Este login não está configurado como acesso de cliente.';
      status.style.color = 'var(--status-warn)';
      return;
    }

    try {
      const certSnap = await getDocs(collection(db, 'empresas', perfil.empresaId, 'certificados'));
      const colaboradoresMap = {};

      certSnap.forEach(certDoc => {
        const c = certDoc.data();
        const colaborador = pick(c, 'colaborador', 'nome', 'aluno', 'funcionario') || '(sem nome)';
        if (!colaboradoresMap[colaborador]) colaboradoresMap[colaborador] = { nome: colaborador, certificados: [] };
        colaboradoresMap[colaborador].certificados.push({
          nr: pick(c, 'nr', 'norma', 'curso', 'treinamento') || '—',
          nome: pick(c, 'nomeCurso', 'descricao', 'tituloCurso') || '',
          data: pick(c, 'validade', 'dataVencimento', 'vencimento', 'dataValidade')
        });
      });

      const colaboradores = Object.values(colaboradoresMap);
      document.getElementById('topbarSub').textContent = `${colaboradores.length} colaborador(es) · ${certSnap.size} certificado(s)`;
      document.getElementById('countTodos').textContent = colaboradores.length;

      if (colaboradores.length === 0) {
        box.innerHTML = '';
        status.textContent = 'Conectado — nenhum certificado cadastrado ainda.';
        return;
      }

      box.innerHTML = colaboradores.map((col, i) => {
        const certsHtml = col.certificados.map(c => {
          const st = statusPorData(c.data);
          return `
            <div class="cert-row">
              <span class="cert-nr">${c.nr}</span>
              <span class="cert-nome">${c.nome}</span>
              <div class="cert-row__meta">
                <span class="cert-data">${c.data || '—'}</span>
                <span class="selo selo--${st.cls}">${st.label}</span>
              </div>
            </div>`;
        }).join('');

        const counts = { danger: 0, warn: 0, ok: 0, pending: 0 };
        col.certificados.forEach(c => counts[statusPorData(c.data).cls]++);
        const resumoHtml = Object.entries(counts).filter(([,n]) => n > 0)
          .map(([cls, n]) => `<span class="selo selo--${cls}">${n} ${cls==='ok'?'válido(s)':cls==='danger'?'vencido(s)':cls==='warn'?'atenção':'pendente(s)'}</span>`).join('');

        return `
          <div class="collab-card ${i === 0 ? 'open' : ''}">
            <div class="collab-head" onclick="this.parentElement.classList.toggle('open')">
              <div class="collab-avatar">${iniciais(col.nome)}</div>
              <div class="collab-info">
                <div class="collab-name">${col.nome}</div>
              </div>
              <div class="collab-summary">${resumoHtml}</div>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="collab-body">${certsHtml}</div>
          </div>`;
      }).join('');

      status.textContent = `${colaboradores.length} colaborador(es) carregado(s).`;
      status.style.color = 'var(--status-ok)';
    } catch (err) {
      console.error('Erro ao carregar certificados:', err);
      status.textContent = `⚠️ Erro ao carregar: ${err.message}`;
      status.style.color = 'var(--status-danger)';
    }
  }

  carregarCertificados();
</script>
<!-- Script de logout — independente, funciona mesmo se o resto da página falhar -->
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>

</body>
</html>
