<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Catálogo de Cursos</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; border-bottom: 1px solid var(--paper-200); padding: var(--space-4) var(--space-6); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--space-3); }
  .topbar h1 { font-size: var(--text-xl); letter-spacing: 0.03em; }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); max-width: 1100px; }
  .card { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-5); }
  .aviso { background: #EAF6EC; border-radius: 8px; padding: 12px 16px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--graphite-600); padding: 8px 10px; border-bottom: 2px solid var(--paper-200); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--paper-100); font-size: 13px; vertical-align: middle; }
  tr.inativo { opacity: .45; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .content { padding: var(--space-4) !important; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar__logo">
      <img src="../assets/img/logo-dark.png" alt="SafeSeg" style="background:var(--graphite-900); border-radius:8px; padding:4px; max-width:150px; display:block;">
    </div>
    <a class="nav-item" href="../index.html" style="background:var(--graphite-900); color:var(--gold-300); margin-bottom:4px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Central (Hub)
    </a>
    <a class="nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>
    <div class="nav-section-label">Comercial (CRM)</div>
    <a class="nav-item" href="leads.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      Leads (Funil)
    </a>
    <a class="nav-item" href="propostas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h3"/></svg>
      Propostas
    </a>
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Catálogo de Cursos
    </a>
    <a class="nav-item" href="mensagens.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Central de Mensagens
    </a>
    <a class="nav-item" href="empresas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/><path d="M19 21V10a1 1 0 0 0-1-1h-3"/><path d="M8 7h2M8 11h2M8 15h2"/></svg>
      Empresas (clientes)

      Financeiro

      Sair

  <div class="main">
    <div class="hazard-stripe"></div>
    <header class="topbar">
      <div>
        <h1>Catálogo de Cursos</h1>
        <div class="sub" id="topbarSub" style="font-size:13px; color:var(--graphite-600);">Carregando...</div>
      </div>
      <button class="btn btn--primary" onclick="abrirModalCurso()">+ Novo Curso</button>
    </header>

    <div class="content">
      <div id="importarBox" class="aviso" style="display:none;">
        📋 O catálogo está vazio. <button class="btn btn--secondary" style="padding:6px 12px; font-size:12px; margin-left:8px;" onclick="importarCatalogoPadrao()">Importar catálogo padrão SafeSeg (83 cursos)</button>
      </div>

      <div id="connStatus" class="text-muted" style="font-size:12px;">Conectando...</div>

      <div class="card">
        <input type="text" id="buscaCursoCatalogo" placeholder="Buscar curso..." oninput="renderCursos()" style="width:100%; border:1px solid var(--paper-200); border-radius:8px; padding:10px 14px; font-size:14px; margin-bottom:14px;">
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Curso</th><th>Carga h.</th><th>Modalidade</th><th>Valor</th><th>Validade</th><th>Status</th><th></th></tr></thead>
          <tbody id="cursosBody"></tbody>
        </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: NOVO/EDITAR CURSO -->
<div id="modalCursoOverlay" style="display:none; position:fixed; inset:0; background:rgba(20,23,27,0.55); align-items:center; justify-content:center; z-index:60; padding:16px;">
  <div style="background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
    <div style="padding:20px; border-bottom:1px solid var(--paper-200); display:flex; align-items:center; justify-content:space-between;">
      <h3 style="font-family:var(--font-display); font-size:1.2rem; margin:0;" id="modalCursoTitulo">Novo Curso</h3>
      <button onclick="fecharModalCurso()" style="background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div style="padding:20px; display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Nome do curso</label>
        <input type="text" id="cursoNome" placeholder="Ex: NR-35 - Trabalho em Altura" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
      </div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Carga Horária</label>
          <input type="text" id="cursoCh" placeholder="Ex: 8h" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
        </div>
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Modalidade</label>
          <select id="cursoMod" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
            <option>Online</option><option>Presencial</option><option>Semipresencial</option><option>Consultoria</option>
          </select>
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Valor (R$)</label>
          <input type="number" id="cursoValor" step="0.01" placeholder="0,00" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
        </div>
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Validade</label>
          <input type="text" id="cursoValidade" placeholder="Ex: 1 ano" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
        </div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Conteúdo programático (opcional)</label>
        <textarea id="cursoProg" rows="4" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:13px; font-family:inherit; resize:vertical;"></textarea>
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
        <input type="checkbox" id="cursoAtivo" checked> Ativo (aparece na busca de curso das Propostas)
      </label>
      <div id="cursoErro" style="color:var(--status-danger); font-size:13px; display:none;"></div>
    </div>
    <div style="padding:16px 20px; border-top:1px solid var(--paper-200); display:flex; justify-content:space-between; gap:8px;">
      <button class="btn btn--danger" id="btnExcluirCurso" style="display:none;" onclick="excluirCurso()">Excluir</button>
      <div style="display:flex; gap:8px; margin-left:auto;">
        <button class="btn btn--secondary" onclick="fecharModalCurso()">Cancelar</button>
        <button class="btn btn--primary" onclick="salvarCurso()">Salvar</button>
      </div>
    </div>
  </div>
</div>

  import { db, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, esperarAuth } from '../assets/js/firebase-init.js';

  let cursosCache = [];
  let editandoId = null;

  function money(v) { return "R$ " + (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2}); }

  async function carregarCursos() {
    const status = document.getElementById('connStatus');
    await esperarAuth();
    try {
      const snap = await getDocs(collection(db, 'catalogoCursos'));
      cursosCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById('importarBox').style.display = cursosCache.length === 0 ? 'block' : 'none';
      renderCursos();
      status.textContent = `✅ ${cursosCache.length} curso(s) carregado(s).`;
      status.style.color = 'var(--status-ok)';
    } catch (err) {
      status.textContent = `⚠️ Erro: ${err.message}`;
      status.style.color = 'var(--status-danger)';
    }
  }

  function renderCursos() {
    const busca = (document.getElementById('buscaCursoCatalogo').value || '').toLowerCase().trim();
    const lista = cursosCache
      .filter(c => !busca || (c.nome||'').toLowerCase().includes(busca))
      .sort((a,b) => (a.nome||'').localeCompare(b.nome||''));

    document.getElementById('topbarSub').textContent = `${cursosCache.length} curso(s) no catálogo`;

    const box = document.getElementById('cursosBody');
    if (lista.length === 0) {
      box.innerHTML = '<tr><td colspan="7" class="text-muted" style="text-align:center; padding:20px;">Nenhum curso encontrado.</td></tr>';
      return;
    }
    box.innerHTML = lista.map(c => `
      <tr class="${c.ativo === false ? 'inativo' : ''}">
        <td>${c.nome}</td>
        <td>${c.ch || '—'}</td>
        <td>${c.mod || '—'}</td>
        <td>${money(c.valor)}</td>
        <td>${c.validade || '—'}</td>
        <td><span class="selo selo--${c.ativo === false ? 'danger' : 'ok'}">${c.ativo === false ? 'Inativo' : 'Ativo'}</span></td>
        <td style="white-space:nowrap;">
          <button class="btn btn--ghost" style="padding:5px 9px; font-size:11px;" onclick="editarCurso('${c.id}')">Editar</button>
          <button class="btn btn--secondary" style="padding:5px 9px; font-size:11px;" onclick="duplicarCurso('${c.id}')">Duplicar</button>
        </td>
      </tr>`).join('');
  }

  window.abrirModalCurso = function() {
    editandoId = null;
    document.getElementById('modalCursoTitulo').textContent = 'Novo Curso';
    document.getElementById('cursoNome').value = '';
    document.getElementById('cursoCh').value = '';
    document.getElementById('cursoMod').value = 'Online';
    document.getElementById('cursoValor').value = '';
    document.getElementById('cursoValidade').value = '1 ano';
    document.getElementById('cursoProg').value = '';
    document.getElementById('cursoAtivo').checked = true;
    document.getElementById('btnExcluirCurso').style.display = 'none';
    document.getElementById('cursoErro').style.display = 'none';
    document.getElementById('modalCursoOverlay').style.display = 'flex';
  };
  window.fecharModalCurso = function() {
    document.getElementById('modalCursoOverlay').style.display = 'none';
  };
  window.editarCurso = function(id) {
    const c = cursosCache.find(x => x.id === id);
    if (!c) return;
    editandoId = id;
    document.getElementById('modalCursoTitulo').textContent = 'Editar Curso';
    document.getElementById('cursoNome').value = c.nome || '';
    document.getElementById('cursoCh').value = c.ch || '';
    document.getElementById('cursoMod').value = c.mod || 'Online';
    document.getElementById('cursoValor').value = c.valor || '';
    document.getElementById('cursoValidade').value = c.validade || '';
    document.getElementById('cursoProg').value = c.prog || '';
    document.getElementById('cursoAtivo').checked = c.ativo !== false;
    document.getElementById('btnExcluirCurso').style.display = 'inline-block';
    document.getElementById('cursoErro').style.display = 'none';
    document.getElementById('modalCursoOverlay').style.display = 'flex';
  };
  window.duplicarCurso = async function(id) {
    const c = cursosCache.find(x => x.id === id);
    if (!c) return;
    try {
      await addDoc(collection(db, 'catalogoCursos'), {
        nome: c.nome + ' (cópia)', ch: c.ch || '', mod: c.mod || 'Online',
        valor: c.valor || 0, validade: c.validade || '', prog: c.prog || '', ativo: true
      });
      carregarCursos();
    } catch (err) { alert('Erro: ' + err.message); }
  };
  window.salvarCurso = async function() {
    const nome = document.getElementById('cursoNome').value.trim();
    const erroBox = document.getElementById('cursoErro');
    if (!nome) { erroBox.textContent = 'Digite o nome do curso.'; erroBox.style.display = 'block'; return; }

    const dados = {
      nome,
      ch: document.getElementById('cursoCh').value.trim(),
      mod: document.getElementById('cursoMod').value,
      valor: Number(document.getElementById('cursoValor').value) || 0,
      validade: document.getElementById('cursoValidade').value.trim(),
      prog: document.getElementById('cursoProg').value.trim(),
      ativo: document.getElementById('cursoAtivo').checked
    };

    try {
      if (editandoId) await updateDoc(doc(db, 'catalogoCursos', editandoId), dados);
      else await addDoc(collection(db, 'catalogoCursos'), dados);
      fecharModalCurso();
      carregarCursos();
    } catch (err) {
      erroBox.textContent = 'Erro: ' + err.message;
      erroBox.style.display = 'block';
    }
  };
  window.excluirCurso = async function() {
    if (!editandoId || !confirm('Excluir esse curso do catálogo? Propostas já feitas com ele não são afetadas.')) return;
    try {
      await deleteDoc(doc(db, 'catalogoCursos', editandoId));
      fecharModalCurso();
      carregarCursos();
    } catch (err) { alert('Erro: ' + err.message); }
  };

  window.importarCatalogoPadrao = async function() {
    if (!confirm(`Importar os ${DEFAULT_COURSES.length} cursos padrão da SafeSeg pro catálogo? Isso só adiciona — não apaga nada que já exista.`)) return;
    const box = document.getElementById('importarBox');
    box.innerHTML = 'Importando...';
    let total = 0;
    for (const c of DEFAULT_COURSES) {
      await addDoc(collection(db, 'catalogoCursos'), {
        nome: c.nome, ch: c.ch || '', mod: c.mod || 'Online',
        valor: c.valor || 0, validade: c.validade || '', prog: c.prog || '', ativo: true
      });
      total++;
      box.innerHTML = `Importando... ${total}/${DEFAULT_COURSES.length}`;
    }
    box.style.display = 'none';
    carregarCursos();
  };

  carregarCursos();
</script>

  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>
