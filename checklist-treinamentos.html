<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SafeSeg — Checklist de Treinamentos</title>
<link rel="stylesheet" href="../assets/css/safeseg-design-system.css">
<style>
  html, body { height: 100%; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; border-bottom: 1px solid var(--paper-200); padding: var(--space-4) var(--space-6); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--space-3); }
  .topbar h1 { font-size: var(--text-xl); letter-spacing: 0.03em; }
  .content { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); max-width: 900px; }
  .card { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-5); }
  .field label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--graphite-600); display: block; margin-bottom: 4px; }
  .field input, .field select { width: 100%; border: 1px solid var(--paper-200); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row .field { flex: 1; min-width: 160px; }
  .categoria-titulo { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--gold-700); margin: 16px 0 8px; letter-spacing: .03em; }
  .categoria-titulo:first-child { margin-top: 0; }
  .item-check { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--paper-100); }
  .item-check input[type="checkbox"] { width: 17px; height: 17px; }
  .item-check .texto { flex: 1; font-size: 13.5px; }
  @media print {
    .sidebar, .topbar, .no-print { display: none !important; }
    .app { display: block !important; }
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .content { padding: var(--space-4) !important; }
    .topbar { padding: var(--space-3) var(--space-4) !important; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar__logo">
      <img src="../assets/img/logo-dark.png" alt="SafeSeg" style="background:var(--graphite-900); border-radius:8px; padding:4px; max-width:150px; display:block;">
    </div>
    <a class="nav-item" href="../index.html" style="background:var(--graphite-900); color:var(--gold-300); margin-bottom:4px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Central (Hub)
    </a>
    <a class="nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>
    <div class="nav-section-label">Gestão Interna</div>
    <a class="nav-item" href="gerador-turmas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M9 18v3M15 18v3"/></svg>
      Gerador de Turmas
    </a>
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Checklist de Treinamentos
    </a>
    <button class="nav-item" style="width:100%; text-align:left; border:none; background:transparent; cursor:pointer; margin-top:auto; color:var(--status-danger);" onclick="fazerLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Sair
    </button>
  </nav>

  <div class="main">
    <div class="hazard-stripe no-print"></div>
    <header class="topbar no-print">
      <div>
        <h1>Checklist de Treinamentos</h1>
        <div class="sub" style="font-size:13px; color:var(--graphite-600);">Uma lista diferente por NR, pra nunca esquecer nada antes/durante a turma</div>
      </div>
      <button class="btn btn--primary" onclick="abrirModalItem()">+ Novo Item</button>
    </header>

    <div class="content">
      <div class="card no-print">
        <div class="row">
          <div class="field">
            <label>Escolhe a NR pra ver/imprimir o checklist</label>
            <select id="fNRAtiva" onchange="renderChecklist()"></select>
          </div>
          <button class="btn btn--secondary" onclick="window.print()">🖨️ Imprimir</button>
        </div>
      </div>

      <div class="card" id="checklistCard">
        <div id="checklistTitulo" style="font-family:var(--font-display); font-size:1.3rem; margin-bottom:12px;"></div>
        <div id="checklistBody">Carregando...</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: NOVO ITEM -->
<div id="modalItemOverlay" class="no-print" style="display:none; position:fixed; inset:0; background:rgba(20,23,27,0.55); align-items:center; justify-content:center; z-index:60; padding:16px;">
  <div style="background:#fff; border-radius:16px; width:100%; max-width:440px; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
    <div style="padding:20px; border-bottom:1px solid var(--paper-200); display:flex; align-items:center; justify-content:space-between;">
      <h3 style="font-family:var(--font-display); font-size:1.2rem; margin:0;">Novo Item de Checklist</h3>
      <button onclick="fecharModalItem()" style="background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div style="padding:20px; display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">NR</label>
        <input type="text" id="itemNR" placeholder="Ex: NR-35" list="listaNRsExistentes" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
        <datalist id="listaNRsExistentes"></datalist>
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Categoria</label>
        <select id="itemCategoria" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
          <option>Documentos</option>
          <option>EPI</option>
          <option>Material</option>
          <option>Antes da Turma</option>
          <option>Outro</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--graphite-600); display:block; margin-bottom:4px;">Item</label>
        <input type="text" id="itemTexto" placeholder="Ex: Cinto de segurança tipo paraquedista" style="width:100%; border:1px solid var(--paper-200); border-radius:6px; padding:9px 12px; font-size:14px;">
      </div>
      <div id="itemErro" style="color:var(--status-danger); font-size:13px; display:none;"></div>
    </div>
    <div style="padding:16px 20px; border-top:1px solid var(--paper-200); display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn--secondary" onclick="fecharModalItem()">Cancelar</button>
      <button class="btn btn--primary" onclick="salvarItem()">Salvar</button>
    </div>
  </div>
</div>

<script type="module">
  try {
    const { esperarAuth } = await import('../assets/js/firebase-init.js');
    await esperarAuth();
  } catch (err) {
    document.body.innerHTML = `<div style="padding:40px;text-align:center;font-family:sans-serif;">⚠️ ${err.message}</div>`;
  }
</script>

<script>
  const LS_CHECKLIST = 'safeseg_checklist_treinamentos_v1';
  function loadItens() { try { return JSON.parse(localStorage.getItem(LS_CHECKLIST)||'[]'); } catch(e) { return []; } }
  function saveItens(list) { localStorage.setItem(LS_CHECKLIST, JSON.stringify(list)); }

  // Semente inicial — só entra se ainda não tiver nada salvo, pra já vir com um exemplo real
  function semearSeVazio() {
    if (loadItens().length > 0) return;
    const seed = [
      { id:'S1', nr:'NR-35', categoria:'Documentos', texto:'ASO com aptidão para trabalho em altura' },
      { id:'S2', nr:'NR-35', categoria:'Documentos', texto:'Lista de presença impressa' },
      { id:'S3', nr:'NR-35', categoria:'EPI', texto:'Cinto de segurança tipo paraquedista' },
      { id:'S4', nr:'NR-35', categoria:'EPI', texto:'Talabarte com trava-quedas' },
      { id:'S5', nr:'NR-35', categoria:'EPI', texto:'Capacete com jugular' },
      { id:'S6', nr:'NR-35', categoria:'Material', texto:'Câmera pra registro fotográfico' },
      { id:'S7', nr:'NR-12', categoria:'Documentos', texto:'Manual de instruções da máquina utilizada' },
      { id:'S8', nr:'NR-12', categoria:'EPI', texto:'Óculos de proteção' },
      { id:'S9', nr:'NR-12', categoria:'Material', texto:'Dispositivo de bloqueio (cadeado LOTO) pra demonstração' },
      { id:'S10', nr:'NR-06', categoria:'Documentos', texto:'Ficha de entrega de EPI (modelo pra assinatura)' }
    ];
    saveItens(seed);
  }

  function popularNRsSelect() {
    const itens = loadItens();
    const nrs = [...new Set(itens.map(i => i.nr))].sort();
    const select = document.getElementById('fNRAtiva');
    select.innerHTML = nrs.map(nr => `<option value="${nr}">${nr}</option>`).join('');
    const datalist = document.getElementById('listaNRsExistentes');
    datalist.innerHTML = nrs.map(nr => `<option value="${nr}">`).join('');
  }

  window.renderChecklist = function() {
    const nrAtiva = document.getElementById('fNRAtiva').value;
    const itens = loadItens().filter(i => i.nr === nrAtiva);
    document.getElementById('checklistTitulo').textContent = `Checklist — ${nrAtiva}`;

    const categorias = [...new Set(itens.map(i => i.categoria))];
    const box = document.getElementById('checklistBody');
    if (itens.length === 0) {
      box.innerHTML = '<div class="text-muted" style="text-align:center; padding:20px;">Nenhum item cadastrado pra essa NR ainda.</div>';
      return;
    }
    box.innerHTML = categorias.map(cat => `
      <div class="categoria-titulo">${cat}</div>
      ${itens.filter(i => i.categoria === cat).map(i => `
        <label class="item-check">
          <input type="checkbox">
          <span class="texto">${i.texto}</span>
          <button class="btn btn--danger no-print" style="padding:3px 8px; font-size:10.5px;" onclick="excluirItem('${i.id}')">✕</button>
        </label>
      `).join('')}
    `).join('');
  };

  window.abrirModalItem = function() {
    document.getElementById('itemNR').value = document.getElementById('fNRAtiva').value || '';
    document.getElementById('itemCategoria').value = 'Documentos';
    document.getElementById('itemTexto').value = '';
    document.getElementById('itemErro').style.display = 'none';
    document.getElementById('modalItemOverlay').style.display = 'flex';
  };
  window.fecharModalItem = function() {
    document.getElementById('modalItemOverlay').style.display = 'none';
  };
  window.salvarItem = function() {
    const nr = document.getElementById('itemNR').value.trim();
    const categoria = document.getElementById('itemCategoria').value;
    const texto = document.getElementById('itemTexto').value.trim();
    const erroBox = document.getElementById('itemErro');
    if (!nr || !texto) { erroBox.textContent = 'Preenche a NR e o item.'; erroBox.style.display = 'block'; return; }

    const itens = loadItens();
    itens.push({ id: 'I'+Date.now(), nr, categoria, texto });
    saveItens(itens);
    fecharModalItem();
    popularNRsSelect();
    document.getElementById('fNRAtiva').value = nr;
    renderChecklist();
  };
  window.excluirItem = function(id) {
    if (!confirm('Remover este item?')) return;
    saveItens(loadItens().filter(i => i.id !== id));
    popularNRsSelect();
    renderChecklist();
  };

  semearSeVazio();
  popularNRsSelect();
  renderChecklist();
</script>
<script type="module">
  import { auth, signOut } from "../assets/js/firebase-init.js";
  window.fazerLogout = async function() {
    if (!confirm("Sair da sua conta?")) return;
    await signOut(auth);
    location.reload();
  };
</script>

</body>
</html>
